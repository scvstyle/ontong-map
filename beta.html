<script>
// ===== 지도 고르기: 카카오맵 / 네이버 지도 =====
// 고른 지도는 이 브라우저에 기억해요(localStorage 'mapv'). 주소 뒤 ?map=naver / ?map=kakao 로도 바꿀 수 있어요.
// 본문 코드는 카카오맵 API 모양(K.LatLng, K.Marker …)으로 쓰고, 네이버를 고르면 같은 모양의 얇은 껍데기(NV)가 대신 일해요.
const MAPV = (()=>{ let v=null; try{ const q=new URLSearchParams(location.search).get('map'); if(q==='naver'||q==='kakao'){ localStorage.setItem('mapv',q); v=q; } else v=localStorage.getItem('mapv'); }catch(_){}
  return (v==='naver'&&'7pzp1heoo6'.indexOf('__')!==0)?'naver':'kakao'; })();
let K=null;
function setMapv(v){ try{ localStorage.setItem('mapv',v); if(map){ const c=map.getCenter(); sessionStorage.setItem('mapview',JSON.stringify({y:c.getLat?c.getLat():c.lat(), x:c.getLng?c.getLng():c.lng(), l:map.getLevel()})); } }catch(_){} const u=new URL(location.href); u.searchParams.delete('map'); location.replace(u.toString()); }
// 네이버 줌(클수록 가까이) ↔ 카카오 레벨(작을수록 가까이)
const NZ = l => 20-l;
function makeNaverShim(){ const N=naver.maps;
  class Map_{ constructor(el,o){ this._n=new N.Map(el,{center:o.center, zoom:NZ(o.level), minZoom:6, maxZoom:19, zoomControl:false, mapDataControl:false, scaleControl:false, logoControlOptions:{position:N.Position.BOTTOM_LEFT}}); this._el=el; }
    getLevel(){ return 20-this._n.getZoom(); } setLevel(l,o){ this._n.setZoom(NZ(l), !!(o&&o.animate)); }
    getCenter(){ return this._n.getCenter(); } setCenter(ll){ this._n.setCenter(ll); } panTo(ll){ this._n.panTo(ll); } panBy(dx,dy){ this._n.panBy(new N.Point(dx,dy)); }
    getProjection(){ const n=this._n, pj=n.getProjection(), el=this._el;
      const c0=()=>pj.fromCoordToOffset(n.getCenter());
      return { containerPointFromCoords(ll){ const a=pj.fromCoordToOffset(ll), c=c0(); return new N.Point(a.x-c.x+el.clientWidth/2, a.y-c.y+el.clientHeight/2); },
               coordsFromContainerPoint(p){ const c=c0(); return pj.fromOffsetToCoord(new N.Point(c.x+p.x-el.clientWidth/2, c.y+p.y-el.clientHeight/2)); } }; } }
  class Marker_{ constructor(o){ this._n=new N.Marker({position:o.position, icon:o.image, title:o.title, zIndex:o.zIndex}); }
    setMap(m){ const t=m?m._n:null; if(this._n.getMap()!==t) this._n.setMap(t); } setImage(img){ this._n.setIcon(img); } setZIndex(z){ this._n.setZIndex(z); } }
  // 카카오 CustomOverlay 흉내: content(HTML 문자열이나 요소)를 좌표에 붙이고 xAnchor·yAnchor 비율만큼 끌어올려요
  class Overlay_ extends N.OverlayView{ constructor(o){ super(); this.pos=o.position; this.xa=o.xAnchor??.5; this.ya=o.yAnchor??.5;

const rid=(n=10)=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>'0123456789abcdefghijklmnopqrstuvwxyz'[x%36]).join('');};
async function sha16(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16); }
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return String(h>>>0); }
// 시트 시간 '2026. 11. 7 오후 2:40:12' 또는 '2026-11-07' → 밀리초(한국시간 기준)
function parseKT(s){ s=String(s||'').trim(); if(/^\d{5}(\.\d+)?$/.test(s)) return Math.round((+s-25569)*864e5-9*3600e3);  // 시트 날짜 숫자(일련번호)
  const m=s.match(/^(\d{4})[.\-]\s*(\d{1,2})[.\-]\s*(\d{1,2})\.?(?:\s*(오전|오후)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?)?/); if(!m) return 0;
  let h=+(m[5]||0); if(m[4]==='오후'&&h<12) h+=12; if(m[4]==='오전'&&h===12) h=0; return Date.UTC(+m[1],+m[2]-1,+m[3],h-9,+(m[6]||0),+(m[7]||0)); }

// 도배 방지(아주 느슨하게): 10분에 100번, 같은 글은 1시간 안에 다시 못 보냄
function sendBlock(text){ const now=Date.now(); const s=LS.get('sends',[]).filter(t=>now-t<600000); if(s.length>=100) return '10분 동안 너무 많이 보냈어요. 조금 뒤에 다시 보내 주세요.';

function markSent(text){ const now=Date.now(); const s=LS.get('sends',[]).filter(t=>now-t<600000); s.push(now); LS.set('sends',s);
  if(text){ const h=LS.get('texts',{}); for(const k in h) if(now-h[k]>3600000) delete h[k]; h[hashStr(text.trim())]=now; LS.set('texts',h);} }

let BRD={rows:[],at:0,err:false}, bv={post:null,replyTo:null};
async function loadBoard(force){ if(!FORM||!FORM.board) return; if(!force&&Date.now()-BRD.at<20000) return;
  try{ BRD.rows=(await fetchStable(FORM.board,'board')).slice(1).filter(r=>r[1]).map(r=>({t:parseKT(r[0]),type:r[1],nick:r[2]||'',meta:r[3]||'',text:r[4]||''})); BRD.at=Date.now(); BRD.err=false; }
  catch(_){ BRD.err=true; } }
async function boardModel(){
  const have=new Set(BRD.rows.map(r=>r.type+'|'+r.meta)), now=Date.now();
  const fresh=LS.get('pend',[]).filter(p=>now-p.t<1800000&&!have.has(p.type+'|'+p.meta)); LS.set('pend',fresh);
  const rows=[...BRD.rows,...fresh.map(p=>({...p,local:true}))].sort((a,b)=>a.t-b.t);
  const items={}, posts=[], acts={};
  for(const r of rows){ const f=r.meta.split('|');
    if(r.type==='게시글'&&f[0]==='p'&&f[1]) posts.push(items[f[1]]={id:f[1],kind:'p',nick:r.nick,t:r.t,text:r.text,owner:f[2]||'',kids:[],all:[],local:r.local});
    else if(r.type==='댓글'&&f[0]==='c'&&f[1]) items[f[1]]={id:f[1],kind:'c',post:f[2],parent:f[3]||'',nick:r.nick,t:r.t,text:r.text,owner:f[4]||'',kids:[],local:r.local};
    else if(['삭제','신고','운영자 숨김','운영자 복구'].includes(r.type)) (acts[f[0]]=acts[f[0]]||[]).push({type:r.type,t:r.t,x:f[1]||''}); }
  for(const id in acts){ const it=items[id]; if(!it) continue; const a=acts[id];
    for(const d of a) if(d.type==='삭제'&&d.x&&it.owner&&(await sha16(d.x))===it.owner) it.deleted=true;
    const ops=a.filter(x=>x.type.startsWith('운영자')), last=ops[ops.length-1];
    if(last&&last.type==='운영자 숨김') it.hidden=true;
    else { const since=last?last.t:0; it.reports=new Set(a.filter(x=>x.type==='신고'&&x.t>=since).map(x=>x.x)).size; if(it.reports>=REPORT_HIDE) it.hidden=true; } }
  for(const id in items){ const c=items[id]; if(c.kind!=='c') continue; const p=items[c.post]; if(!p||p.kind!=='p') continue; p.all.push(c); const par=c.parent&&items[c.parent]; (par&&par.kind==='c'?par.kids:p.kids).push(c); }
  posts.sort((a,b)=>b.t-a.t); return {items,posts:posts.filter(p=>!p.deleted)}; }
const mine=id=>LS.get('mine',{})[id];
const alive=c=>!c.deleted;
function canDelete(it,M){ if(it.kind==='p') return !it.all.some(alive); const p=M.items[it.post]; return !(p&&p.all.some(c=>c!==it&&alive(c)&&c.t>=it.t)) && !it.kids.some(alive); }

function metaHtml(it){ return `<div class="meta"><b>${esc(it.nick||'익명')}</b><span>${ago(it.t)}</span>${it.local?'<span class="tag loc">올리는 중 · 다른 사람에겐 1~5분 뒤 보여요</span>':''}${OPS&&it.hidden?'<span class="tag hid">숨김</span>':''}${OPS&&it.reports?`<span class="tag">신고 ${it.reports}</span>`:''}</div>`; }

    <div class="bhead"><span>${BRD.err?'글을 불러오지 못했어요.':`글 ${M.posts.filter(p=>!p.hidden||OPS).length}개`}</span><span class="sp"></span><button data-a="refresh">새로고침</button></div>

async function boardAct(a,id){
  const M=await boardModel(), it=id&&M.items[id];

    const why=sendBlock(text); if(why) return dlg(why);

    const why=sendBlock(''); if(why) return dlg(why); const meta=`${id}|${myDev()}`; formSend('신고','',meta,''); pend('신고','',meta,''); markSent('');

}

const saveU=()=>LSS('cat',{sel:U.sel,subs:U.subs,all:U.all,fuel:U.fuel,every:U.every,lastFuel:U.lastFuel});
// 대분류 '전체'(U.every): 모든 가맹점. 켜져 있는 동안 다른 대분류 선택은 흐리게 기억
const gasOn=()=>U.every||(U.sel.includes(GAS)&&!!U.fuel);
const noFuel=()=>U.every&&!U.fuel;   // '전체'인데 유종을 안 고름 → 주유소는 핀+상호만(가격 없음)
if(U.fuel) state.fuel=U.fuel;
// 소분류가 하나도 없는 대분류는 '지금 보고 있는' 것 말고는 선택에서 뺌(연한 청록 안 남게)
const hasSub=g=>g===GAS?!!U.fuel:!!(U.all[g]||(U.subs[g]||[]).length);
const prune=()=>{ if(U.every) return; U.sel=U.sel.filter(g=>g===U.cur||hasSub(g)); };
prune();

// ---- 데이터: 대분류별 파일을 고를 때 불러옴 ----
let META=null; const ROWS={}, LOADING={};
const gIdx=g=>META?META.groups.indexOf(g):-1;
function subId(g,s){ return META.subIdx[g+'|'+s]; }
function ensure(gs){ if(!META) return Promise.resolve(); return Promise.all(gs.map(g=>{ const i=gIdx(g); if(i<0||ROWS[i]) return null;
  return LOADING[i]||(LOADING[i]=fetch(`odt/g${i}.json?v=${META.base}`).then(r=>r.json()).then(rows=>{ ROWS[i]=rows.map((r,k)=>({n:r[0],a:r[1],x:r[2],y:r[3],s:r.slice(4),g:i,k})); }).catch(()=>{})); })); }
const activeSubs=()=>{ const S=new Set(); if(!META) return S; if(U.every){ META.subs.forEach((_,i)=>S.add(i)); return S; } U.sel.forEach(g=>{ if(g===GAS) return; (U.all[g]?SUBN[g]:(U.subs[g]||[])).forEach(s=>{ const id=subId(g,s); if(id!=null) S.add(id); }); }); return S; };
const subName=id=>META.subs[id][1], grpName=id=>META.groups[META.subs[id][0]];
const catLine=r=>r.s.map(id=>`${e(grpName(id))}<s>›</s>${e(subName(id))}`).join('<s>·</s>');
function rowsActive(){ const S=activeSubs(), out=[]; if(!S.size) return out;
  for(const i in ROWS){ for(const r of ROWS[i]) if(r.s.some(id=>S.has(id))) out.push(r); } return out; }
const iconOf=(r,S)=>{ if(r.gas!=null) return 'gas-station'; const id=(S&&r.s.find(x=>S.has(x)))??r.s[0]; return SICON[subName(id)]||'dots'; };
// 주유소를 다른 업종과 같이 고르면: 주유소도 같은 묶음에 넣음(혼자 남으면 핀+상호+가격). 주유만이면 기존 가격 말풍선 방식
const mixed=()=>gasOn()&&state.prep&&activeSubs().size>0;
const gasRows=()=>DATA.map((p,i)=>visible(p)?{n:p.n,a:p.a.replace(/^대전(광역시)?\s*/,''),x:p.x,y:p.y,s:[],gas:i,c:p.c}:null).filter(Boolean);
const stCls=r=>r.gas!=null?'st-'+r.c:'st-prep';
const gasSub=r=>{ const v=!noFuel()&&priceOf(DATA[r.gas]); return v?`${FUEL[state.fuel]} ${won(v.v)}원`:'주유·충전'; };
const subOf=(r,S)=>r.gas!=null?gasSub(r):subName(r.s.find(x=>S.has(x))??r.s[0]);
function openAny(r){ if(r.gas==null) return openRow(r,false); collapse(); closeStack(); openCard(r.gas,false); }
const cut=(t,n)=>t.length>n?t.slice(0,n)+'…':t;

// ---- 분류 화면 ----
document.querySelector('.bar').style.display='none';
const top=document.querySelector('.top');
const cats=document.createElement('div'); cats.className='cats'; cats.innerHTML='<div class="ccol" id="gcol"></div><div class="ccol" id="scol"></div>';
const cb=document.createElement('button'); cb.className='cbtn'; top.appendChild(cats); top.appendChild(cb);
function draw(){
  cats.hidden=!U.open; cb.hidden=U.open;
  // 분류 버튼: '분류 선택' + 요약(대분류 1개: '쇼핑 · 3', 여러 개: '쇼핑 외 1 · 4', '전체'는 그 대분류 소분류 수로 셈)
  const eff=U.every?[]:U.sel.filter(hasSub), nSub=eff.reduce((s,g)=>s+(g===GAS?1:U.all[g]?SUBN[g].length:U.subs[g].length),0);
  const sum=U.every?'전체':!eff.length?'':eff.length===1&&eff[0]===GAS?`${GAS} · ${FUELS.find(f=>f[0]===U.fuel)[1]}`:eff.length===1&&U.all[eff[0]]?`${eff[0]} · 전체`:`${eff[0]}${eff.length>1?` 외 ${eff.length-1}`:''} · ${nSub}`;
  cb.innerHTML=`${ic('adjustments-horizontal')}<b>분류 선택</b>${sum?`<i>${e(sum)}</i>`:''}`;
  const pw=document.querySelector('.pill'); if(pw&&pw.offsetWidth) cb.style.minWidth=pw.offsetWidth+'px';
  document.getElementById('gcol').innerHTML=`<button class="gb all${U.every?' cur':''}" data-g="">${ic('checks')}전체</button>`+CATS.map(([g])=>`<button class="gb${U.sel.includes(g)?(U.every?' on mem':U.cur===g?' cur':' on'):''}" data-g="${e(g)}">${ic(GI[g])}${e(g)}</button>`).join('');
  const sc=document.getElementById('scol'); sc.hidden=!U.cur;
  if(U.cur===GAS) sc.innerHTML=FUELS.map(([k,n])=>`<button class="rb${U.fuel===k?' on':''}" data-f="${k}"><span class="rd"></span>${n}</button>`).join('');
  else if(U.cur){ const g=U.cur, all=!!U.all[g], on=U.subs[g]||[];
    sc.innerHTML=`<button class="sb all${all?' on':''}" data-s=""><span class="ck">${ic('checks')}</span>전체</button>`+SUBN[g].map(s=>`<button class="sb${on.includes(s)?' on'+(all?' mem':''):''}" data-s="${e(s)}"><span class="ck">${ic(SICON[s])}</span>${e(s)}</button>`).join(''); }

function fit(){ const pa=document.getElementById('panel').getBoundingClientRect(); const lim=(innerWidth<=820?pa.top:innerHeight)-12;
  document.querySelectorAll('.ccol').forEach(c=>{ if(c.hidden) return; c.style.maxHeight=Math.max(110,lim-c.getBoundingClientRect().top)+'px'; mask(c); }); }
function mask(c){ c.classList.toggle('more',c.scrollTop+c.clientHeight<c.scrollHeight-2); c.classList.toggle('up',c.scrollTop>2); }
document.querySelectorAll('.ccol').forEach(c=>c.addEventListener('scroll',()=>mask(c),{passive:true}));
cats.addEventListener('click',ev=>{ ev.stopPropagation();
  const g=ev.target.closest('.gb'), s=ev.target.closest('.sb'), r=ev.target.closest('.rb'); let scrollKeep=null;
  if(g){ const n=g.dataset.g;
    if(!n){ U.every=!U.every; U.cur=null; }   // 대분류 '전체'
    else if(U.every&&U.sel.includes(n)) U.sel=U.sel.filter(x=>x!==n);   // 흐린(기억된) 것 → 기억에서 해제, '전체' 유지
    else { if(U.every){ U.every=false; prune(); }   // 다른 것 → '전체' 끄고 그것 켬(기억된 것 되살아남)
      if(!U.sel.includes(n)){ U.sel.push(n); U.cur=n;
        // 처음 켜는 대분류는 소분류 '전체'로 시작. 골라 둔 게 있으면 그대로
        if(n===GAS){ if(!U.fuel){ U.fuel=U.lastFuel||'B027'; state.fuel=U.fuel; savePref(); } }
        else if(!hasSub(n)) U.all[n]=true; }
      else if(U.cur!==n) U.cur=n; else {U.sel=U.sel.filter(x=>x!==n);U.cur=null;} }
    document.getElementById('scol').scrollTop=0; scrollKeep=document.getElementById('gcol').scrollTop; }
  if(s){ const g0=U.cur, n=s.dataset.s, on=U.subs[g0]||(U.subs[g0]=[]); scrollKeep=null;
    if(!n) U.all[g0]=!U.all[g0];
    else if(U.all[g0]){ const i=on.indexOf(n); if(i>=0) on.splice(i,1); else { U.all[g0]=false; on.push(n); } }  // 흐린 것 → 기억에서 해제 / 체크 안 된 것 → '전체' 끄고 켬
    else { const i=on.indexOf(n); if(i<0) on.push(n); else on.splice(i,1); } }
  if(r){ U.fuel=U.fuel===r.dataset.f?null:r.dataset.f; if(U.fuel){ U.lastFuel=U.fuel; state.fuel=U.fuel; savePref(); } }   // 같은 유종 다시 누르면 해제
  prune();
  const sv=document.getElementById('scol').scrollTop; saveU(); draw(); if(s) document.getElementById('scol').scrollTop=sv; if(scrollKeep!=null) document.getElementById('gcol').scrollTop=scrollKeep;
  if(g||s||r){ closeCard(); ensure(wantG()).then(refresh); refresh(); } });
function wantG(){ return U.every&&META?META.groups:U.sel.filter(x=>x!==GAS); }
cb.addEventListener('click',ev=>{ ev.stopPropagation(); U.open=true; closeCard(); draw(); });
let pulsed=false;   // 처음 접힐 때 한 번만 분류 버튼을 살짝 깜빡여 눈에 띄게
const collapse=()=>{ if(U.open){ U.open=false; draw(); if(!pulsed){ pulsed=true; cb.classList.add('pulse'); setTimeout(()=>cb.classList.remove('pulse'),2600); } } };

// ---- 캐시백 칩 4번째: 준비 중 ----
if(!PREF_KEYS.includes('prep')) PREF_KEYS.push('prep');
{ const sp=LSG('pref'); state.prep=sp&&typeof sp.prep==='boolean'?sp.prep:true; }
{ const c=document.createElement('span'); c.className='chip'+(state.prep?' on':''); c.dataset.f='prep'; c.innerHTML='<span class="dot prep"></span>파악 중';
  document.querySelector('.status').appendChild(c);
  c.addEventListener('click',()=>{ state.prep=!state.prep; c.classList.toggle('on',state.prep); savePref(); closeCard(); refresh(); }); }

// ---- 주유소: 고른 경우에만, 핀은 캐시백 색 동그라미+주유기 ----
const _sells=sells; sells=function(p){ return noFuel()?true:_sells(p); };   // '전체'+유종 미선택: 모든 주유소·충전소
const visGas=visible; visible=function(p){ return gasOn()&&visGas(p); };
function gasPin(c,big){ const col={ok:'#0f9d8a',no:'#8a939e',check:'#d98a00'}[c], z=big?34:28, r=z/2-1.5, s=(big?.78:.64), o=(z-24*s)/2;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${z}" height="${z}" viewBox="0 0 ${z} ${z}"><circle cx="${z/2}" cy="${z/2}" r="${r}" fill="${col}" stroke="#fff" stroke-width="2"/><g transform="translate(${o} ${o}) scale(${s})" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${ICONS['gas-station']}</g></svg>`;
  return new K.MarkerImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg), new K.Size(z,z), {offset:new K.Point(z/2,z/2)}); }

// ---- 화면 크기 버튼(지도 바꾸기 위) ----
{ const mv=document.getElementById('mapv'); const box=document.createElement('div'); box.className='ctrl';
  box.innerHTML=`<button id="szb" aria-label="${BIG?'작게 보기':'크게 보기'}" title="${BIG?'작게 보기':'크게 보기'}"><b>가</b><small>${BIG?'작게':'크게'}</small></button>`;
  mv.closest('.ctrl').before(box); box.firstChild.addEventListener('click',ev=>{ ev.stopPropagation(); LSS('big',!BIG); location.reload(); }); }

// ---- 마커 ----
const cvs=document.createElement('canvas').getContext('2d');
const tw=(t,f)=>{ cvs.font=f+' Pretendard, sans-serif'; return cvs.measureText(t).width; };
const hit=(a,b,g)=>a.l<b.r+g&&a.r>b.l-g&&a.t<b.b+g&&a.b>b.t-g;
const FT=()=>BIG?{n:'700 12.5px',s:'500 10.5px',R:14,h:30}:{n:'700 11.5px',s:'500 10px',R:13.5,h:28};
const MERGE=44, HALO=46, FAR=260;   // 묶음 퍼짐 상한, 범위 원 상한, 이보다 많이 보이면 숫자 원(격자)
let OV=[], openSt=null, cardOv=null, cardPin=null;
function area(){ const m=document.getElementById('map'), mw=document.querySelector('.mapwrap').getBoundingClientRect(), pa=document.getElementById('panel').getBoundingClientRect();
  return {W:m.clientWidth, top:0, bot:innerWidth<=820?Math.min(mw.height,pa.top-mw.top):mw.height}; }
const put=(r,el,z,click)=>{ const o=new K.CustomOverlay({position:new K.LatLng(r.y,r.x),content:el,xAnchor:.5,yAnchor:.5,zIndex:z,clickable:!!click}); o.setMap(map); OV.push(o); return o; };
function clearOv(){ closeStack(); OV.forEach(o=>o.setMap(null)); OV=[]; }
const pinHTML=(icon,st,n,lab,name,sub)=>`<div class="pc">${ic(icon)}${n>1?`<em>${n}</em>`:''}</div>`+(lab?`<div class="pl pl-${lab}"><b>${e(name)}</b>${sub?`<small>${e(sub)}</small>`:''}</div>`:'');
function closeStack(){ if(openSt){ if(openSt.host) openSt.host.style.zIndex=openSt.z; openSt.st.remove(); openSt.el.classList.remove('open'); const pl=openSt.el.querySelector('.pl'); if(pl) pl.style.display=''; openSt=null; } }
function openStack(el,items,zoomTo,left){ closeStack(); const S=activeSubs(), c=map.getCenter(), cy=la(c), cx=lo(c);
  const list=[...items].sort((a,b)=>dist2(a,cy,cx)-dist2(b,cy,cx));   // 지금은 모두 '준비 중' → 가까운 순(시 자료 오면 켜진 칩 우선)
  const st=document.createElement('div'); st.className='bst'; st.style.left=left+'px';
  st.innerHTML=`<div class="bsc">${list.map((r,i)=>`<button class="bi" data-i="${i}"><span class="mp sm ${stCls(r)}"><span class="pc">${ic(iconOf(r,S))}</span></span>${e(r.n)}</button>`).join('')}</div>`+(zoomTo?`<button class="bz">${ic('zoom')}지도 확대해서 보기</button>`:'');
  const sc=st.firstChild; sc.addEventListener('scroll',()=>mask(sc),{passive:true});
  st.addEventListener('click',ev=>{ ev.stopPropagation(); const b=ev.target.closest('.bi'); if(b){ openAny(list[+b.dataset.i]); return; }
    if(ev.target.closest('.bz')){ closeStack(); map.setLevel(Math.max(1,map.getLevel()-2),{animate:true}); map.panTo(zoomTo); } });
  el.appendChild(st); el.classList.add('open'); const pl=el.querySelector('.pl'); if(pl) pl.style.display='none';
  requestAnimationFrame(()=>mask(sc)); const host=el.parentElement, z=host?host.style.zIndex:''; if(host) host.style.zIndex='1000'; openSt={el,st,host,z}; }
const dist2=(r,cy,cx)=>{ const dy=r.y-cy, dx=(r.x-cx)*0.807; return dx*dx+dy*dy; };   // 위도 36°에서 경도 1°≈0.807×위도 1°
function inBox(){ const A=area(), pj=map.getProjection(), a=pj.coordsFromContainerPoint(new K.Point(0,A.top)), b=pj.coordsFromContainerPoint(new K.Point(A.W,A.bot));
  return {n:Math.max(la(a),la(b)),s:Math.min(la(a),la(b)),w:Math.min(lo(a),lo(b)),e:Math.max(lo(a),lo(b))}; }
function drawOdt(){
  if(!map||!map.getProjection||dragging) return; clearOv();
  const S=activeSubs(), M=mixed(), q=state.q, src=[...(state.prep&&S.size?rowsActive().filter(r=>!q||(r.n+' '+r.a).toLowerCase().includes(q)):[]),...(M?gasRows():[])];   // 검색 중이면 지도에도 검색된 곳만   // 지금 다른 업종은 모두 '준비 중'
  if(!src.length) return;
  const B=inBox(), A=area(), pj=map.getProjection(), pts=[];
  for(const r of src){ if(r.y>B.n||r.y<B.s||r.x<B.w||r.x>B.e) continue; const p=pj.containerPointFromCoords(new K.LatLng(r.y,r.x)); pts.push({r,x:p.x,y:p.y}); }
  if(!pts.length) return;
  const F=FT(), mw=document.querySelector('.mapwrap').getBoundingClientRect(), ui=[...document.querySelectorAll('.pill,.status,.ctrls,.cbtn:not([hidden]),.cats:not([hidden]),.fakebar')].map(el=>{const r=el.getBoundingClientRect(); return {l:r.left-mw.left,t:r.top-mw.top,r:r.right-mw.left,b:r.bottom-mw.top};});
  const pb=(x,y,r)=>({l:x-r,t:y-r,r:x+r,b:y+r});
  // 핀 옆 상호 자리 찾기(아래→오른쪽→왼쪽→위). 다른 핀·묶음·상호·화면 위 버튼과 겹치면 다음 자리, 다 막히면 null
  const spot=(x,y,name,sub,O)=>{ const w=Math.max(tw(name,F.n),sub?tw(sub,F.s):0)+4, h=sub?F.h:F.h-12, d=F.R+2;
    const C={b:{l:x-w/2,t:y+d,r:x+w/2,b:y+d+h},r:{l:x+d+1,t:y-h/2,r:x+d+1+w,b:y+h/2},l:{l:x-d-1-w,t:y-h/2,r:x-d-1,b:y+h/2},t:{l:x-w/2,t:y-d-h,r:x+w/2,b:y-d}};
    for(const k of ['b','r','l','t']){ const c=C[k]; if(c.l<2||c.r>A.W-2||c.b>A.bot||c.t<A.top) continue; if(!O.some(o=>hit(o,c,3))&&!ui.some(o=>hit(o,c,2))) return {k,c}; } return null; };
  const pinEl=(r,lab,name,sub)=>{ const d=document.createElement('div'); d.className='mp '+stCls(r); d.innerHTML=pinHTML(iconOf(r,S),'',1,lab,name,sub); d.querySelector('.pc').addEventListener('click',ev=>{ev.stopPropagation(); openAny(r);}); return d; };
  if(pts.length>FAR){ // 멀리: 격자 72px 숫자 원. 누르면 세로 목록 + 지도 확대. 혼자 있는 곳은 핀+상호(짧게)
    const G={}, cell=72; pts.forEach(p=>{ const k=Math.floor(p.x/cell)+','+Math.floor(p.y/cell); (G[k]=G[k]||[]).push(p); });
    const singles=[], boxes=[];
    Object.values(G).forEach(g=>{ if(g.length===1){ const bx=pb(g[0].x,g[0].y,F.R+1); singles.push(Object.assign(g[0],{bx})); boxes.push(bx); return; }
      const y=g.reduce((s,p)=>s+p.r.y,0)/g.length, x=g.reduce((s,p)=>s+p.r.x,0)/g.length, n=g.length, sz=Math.min(50,28+Math.log2(n)*3.2);
      const px=g.reduce((s,p)=>s+p.x,0)/n, py=g.reduce((s,p)=>s+p.y,0)/n; boxes.push(pb(px,py,sz/2+3));
      const d=document.createElement('div'); d.className='mcw'; d.innerHTML=`<div class="mc" style="--d:${sz}px">${n>=1000?(n/1000).toFixed(1)+'천':n}</div>`;
      d.firstChild.addEventListener('click',ev=>{ ev.stopPropagation(); if(openSt&&openSt.el===d) return closeStack(); collapse(); openStack(d,g.map(p=>p.r),new K.LatLng(y,x),sz/2+6); }); put({x,y},d,4,true); });
    const cx=A.W/2, cy=(A.top+A.bot)/2;
    singles.sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy)).forEach(p=>{ const r=p.r, name=cut(r.n,8), sub=r.gas!=null?gasSub(r).replace(/^\S+\s/,''):'';
      const sp=spot(p.x,p.y,name,sub,boxes.filter(o=>o!==p.bx)); if(sp) boxes.push(sp.c); put(r,pinEl(r,sp&&sp.k,name,sub),3,true); });
    return; }
  // 같은 좌표 = 같은 건물 → 네모 핀 하나
  const by={}; pts.forEach(p=>{ const k=p.r.x+','+p.r.y; (by[k]=by[k]||[]).push(p); });
  const pins=Object.values(by).map(g=>({x:g[0].x,y:g[0].y,rows:g.map(p=>p.r)}));
  const cx=A.W/2, cy=(A.top+A.bot)/2, out=[];
  pins.sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy)).forEach(p=>{
    const O=out.flatMap(m=>m.boxes), box=pb(p.x,p.y,F.R+1), r0=p.rows[0], bld=p.rows.length>1;
    const name=bld?(r0.a.split(' ').slice(1).join(' ').split(',')[0]):r0.n, sub=bld?`${p.rows.length}곳`:subOf(r0,S);
    if(!O.some(o=>hit(o,box,1))){ const sp=spot(p.x,p.y,name,sub,O);
      if(sp){ out.push({type:bld?'bld':'one',x:p.x,y:p.y,rows:p.rows,lab:sp.k,name,sub,boxes:[box,sp.c]}); return; } }
    let best=null,bd=1e9; out.forEach(m=>{ if(m.type==='bld') return; const dd=Math.hypot(m.x-p.x,m.y-p.y); if(dd<bd){bd=dd;best=m;} });
    if(!bld&&best&&bd<=MERGE){ const its=[...(best.items||[{x:best.x,y:best.y,rows:best.rows}]),p], x=its.reduce((s,q)=>s+q.x,0)/its.length, y=its.reduce((s,q)=>s+q.y,0)/its.length;
      if(its.every(q=>Math.hypot(q.x-x,q.y-y)<=MERGE)){ Object.assign(best,{type:'grp',items:its,rows:its.flatMap(q=>q.rows),x,y,lab:null,boxes:[pb(x,y,24)]}); return; } }
    out.push({type:bld?'bld':'one',x:p.x,y:p.y,rows:p.rows,lab:null,name,sub,boxes:[box]}); });
  out.forEach(m=>{ const d=document.createElement('div'), ll=pj.coordsFromContainerPoint(new K.Point(m.x,m.y)), pos={y:la(ll),x:lo(ll)};
    if(m.type==='grp'){ const ic3=[...new Set(m.rows.map(r=>iconOf(r,S)))].slice(0,3), rad=Math.min(HALO,Math.max(...m.items.map(q=>Math.hypot(q.x-m.x,q.y-m.y)))+12);
      d.className='mg'; d.innerHTML=`<div class="halo" style="width:${2*rad}px;height:${2*rad}px"></div><div class="gp"><span class="gi">${ic3.map(n=>`<i>${ic(n)}</i>`).join('')}</span><b>${m.rows.length}</b></div>`;
      d.querySelector('.gp').addEventListener('click',ev=>{ ev.stopPropagation(); if(openSt&&openSt.el===d) return closeStack(); collapse(); openStack(d,m.rows,new K.LatLng(pos.y,pos.x),d.querySelector('.gp').offsetWidth/2+6); });
      put(pos,d,5,true); return; }
    const r0=m.rows[0];
    if(m.type==='one'){ put(r0,pinEl(r0,m.lab,m.name,m.sub),3,true); return; }
    d.className='mp st-prep bld'; d.innerHTML=pinHTML('buildings','prep',m.rows.length,m.lab,m.name,m.sub);
    d.querySelector('.pc').addEventListener('click',ev=>{ ev.stopPropagation(); if(openSt&&openSt.el===d) return closeStack(); collapse(); openStack(d,m.rows,null,20); });
    put(pos,d,6,true); });
}
// ---- 가게 정보창 ----
function openRow(r,pan){ collapse(); closeStack(); closeCard(); const S=activeSubs();
  const L=placeLinks({n:r.n,x:r.x,y:r.y,a:'대전 '+r.a,g:'',nn:''});
  const el=document.createElement('div');
  el.innerHTML=`<div class="card"><button class="x">×</button><span class="badge b-prep" style="font-size:11px;font-weight:700;border-radius:6px;padding:3px 6px">캐시백 여부 파악 중</span><h3>${e(r.n)}</h3><div class="cg">${catLine(r)}</div><div class="row">대전 ${e(r.a)}</div><div class="links"><a href="${L.place}"${L.placeApp?` data-app="${L.placeApp}"`:''} target="_blank" rel="noopener">${L.name}</a><a class="primary" href="${L.nav}"${L.app?` data-app="${L.app}"`:''} target="_blank" rel="noopener">길찾기</a></div></div>`;
  el.querySelector('.x').addEventListener('click',ev=>{ ev.stopPropagation(); closeCard(); });
  const pin=document.createElement('div'); pin.className='mp big st-prep'; pin.innerHTML=pinHTML(iconOf(r,S));
  cardPin=new K.CustomOverlay({position:new K.LatLng(r.y,r.x),content:pin,xAnchor:.5,yAnchor:.5,zIndex:9}); cardPin.setMap(map);
  cardOv=new K.CustomOverlay({position:new K.LatLng(r.y,r.x),content:el.firstChild,yAnchor:1,zIndex:10,clickable:true}); cardOv.setMap(map);
  if(innerWidth<=820){ if(preCardMin===null) preCardMin=panelEl().classList.contains('min'); setPanel(true); }
  if(pan) map.panTo(new K.LatLng(r.y,r.x)); setTimeout(fitCard, pan?450:280); }
const hideGas=hideCard; hideCard=function(){ const j=selI; hideGas(); if(j>=0&&mixed()&&markers[j]) markers[j].setMap(null); if(cardOv){ cardOv.setMap(null); cardOv=null; } if(cardPin){ cardPin.setMap(null); cardPin=null; } };
closeCard=function(){ const had=!!overlay||!!cardOv; hideCard(); if(had&&preCardMin!==null&&innerWidth<=820) setPanel(preCardMin); preCardMin=null; };

// ---- 리스트·검색 ----
let LIMIT=60, sortGas=LSG('gsort')||'price';
const distTxt=(r,cy,cx)=>{ const m=Math.sqrt(dist2(r,cy,cx))*111000; return m<1000?Math.round(m/10)*10+'m':(m/1000).toFixed(1)+'km'; };
const itemRow=(r,cy,cx)=>`<div class="item i3" data-r="${r.g}:${r.k}"><span class="badge b-prep">파악 중</span><div class="nm">${e(r.n)}</div><div class="cg">${catLine(r)}</div><div class="ad">${e(r.a.replace(/^\S+구\s*/,''))}</div><div class="ds">${distTxt(r,cy,cx)}</div></div>`;
const gasRow=(i,cy,cx)=>{ const p=DATA[i], pr=priceOf(p); return `<div class="item i3${i===selI?' sel':''}" data-i="${i}"><span class="badge ${BADGE[p.c]}">${SHORT[p.c]}</span><div class="nm">${esc(p.n)}</div><div class="cg">주유·충전<s>›</s>${p.t==='충전소'?'충전소':'주유소'}</div><div class="ad">${esc(p.g)} · ${esc(p.a.replace(/^대전(광역시)?\s*\S+구\s*/,''))}</div><div class="pr2">${noFuel()?'':pr?`<b>${won(pr.v)}</b><small>원</small>`:'<small>가격 없음</small>'}<i>${distTxt(p,cy,cx)}</i></div></div>`; };
const GRANK={ok:0,check:1,no:2};
renderList=function(){
  const list=document.getElementById('list'), cnt=document.getElementById('count'), c=map?map.getCenter():null, cy=c?la(c):36.35, cx=c?lo(c):127.38;
  const q=state.q, local=state.scope==='view'&&!q;
  document.getElementById('scope').classList.toggle('off',false);   // 검색도 '이 지도 안 | 대전 전체'를 따름
  let sg=document.querySelector('.sortseg'); const onlyGas=gasOn()&&!activeSubs().size;
  if(onlyGas&&!q){ if(!sg){ sg=document.createElement('div'); sg.className='sortseg'; sg.innerHTML='<button data-s="price">가격순</button><button data-s="dist">거리순</button>'; document.querySelector('.countrow').insertBefore(sg,cnt);
      sg.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(b){ sortGas=b.dataset.s; LSS('gsort',sortGas); LIMIT=60; renderList(); } }); }
    sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===sortGas)); }
  else if(sg) sg.remove();
  if(q){ return renderSearch(list,cnt,cy,cx); }
  if(!U.sel.length&&!U.every){ list.innerHTML='<div class="empty">왼쪽 위에서 업종을 골라 보세요</div>'; cnt.textContent=''; return; }
  const B=local&&map?inBox():null, inb=r=>!B||(r.y<=B.n&&r.y>=B.s&&r.x>=B.w&&r.x<=B.e);
  const gi=gasOn()?DATA.map((p,i)=>i).filter(i=>visible(DATA[i])&&(!local||inView(DATA[i]))):[];
  const rows=state.prep?rowsActive().filter(inb):[];
  const items=[...gi.map(i=>({gas:i,p:DATA[i]})),...rows.map(r=>({r}))];
  if(onlyGas&&sortGas==='price'){ const pv=i=>{const v=priceOf(DATA[i]);return v?v.v:1e9;}; items.sort((a,b)=>pv(a.gas)-pv(b.gas)||dist2(a.p,cy,cx)-dist2(b.p,cy,cx)); }
  else items.sort((a,b)=>{ const ra=a.gas!=null?GRANK[a.p.c]:1, rb=b.gas!=null?GRANK[b.p.c]:1; return ra-rb||dist2(a.p||a.r,cy,cx)-dist2(b.p||b.r,cy,cx); });   // 켜진 칩(캐시백 제공 먼저) → 가까운 순
  const total=items.length, html=items.slice(0,LIMIT).map(it=>it.gas!=null?gasRow(it.gas,cy,cx):itemRow(it.r,cy,cx)).join('');
  if(!total&&local){ const all=(gasOn()?DATA.filter(p=>visible(p)).length:0)+(state.prep?rowsActive().length:0);
    list.innerHTML=`<div class="empty">이 지도 안에는 없어요${all?` · <a href="#" id="toAll">대전 전체에 ${all.toLocaleString()}곳</a>`:''}</div>`;
    const a=document.getElementById('toAll'); if(a) a.addEventListener('click',ev=>{ ev.preventDefault(); state.scope='all'; savePref(); syncFilterUI(); renderList(); }); }
  else list.innerHTML=html+(total>LIMIT?'<button class="morebtn" id="moreL">더 보기</button>':'');
  const mb=document.getElementById('moreL'); if(mb) mb.addEventListener('click',()=>{ LIMIT+=60; renderList(); });
  cnt.textContent=`${total.toLocaleString()}곳 · ${onlyGas&&sortGas==='price'?'가격순':'가까운 순'}`; };
async function renderSearch(list,cnt,cy,cx){ const q=state.q, my=++renderSearch.n;
  if(META&&Object.keys(ROWS).length<META.groups.length){ list.innerHTML='<div class="empty">찾는 중…</div>'; await ensure(META.groups); if(my!==renderSearch.n) return; }
  const S=activeSubs(), selG=new Set(U.every?[]:U.sel.filter(g=>g!==GAS&&!U.all[g]).map(gIdx)), hitR=r=>(r.n+' '+r.a).toLowerCase().includes(q);
  const A=[],B=[],C=[];
  for(const i in ROWS) for(const r of ROWS[i]){ if(!hitR(r)) continue; if(r.s.some(id=>S.has(id))) A.push({r}); else if(r.s.some(id=>selG.has(META.subs[id][0]))) B.push({r}); else C.push({r}); }
  DATA.forEach((p,i)=>{ if(!visGas(p)) return; (gasOn()?A:C).push({gas:i,p}); });
  const ord=x=>x.sort((a,b)=>{ const ra=a.gas!=null?GRANK[a.p.c]:1, rb=b.gas!=null?GRANK[b.p.c]:1; return ra-rb||dist2(a.p||a.r,cy,cx)-dist2(b.p||b.r,cy,cx); });
  // '이 지도 안'이면 검색도 지금 지도 안에서만. 밖에 더 있으면 '대전 전체' 안내
  const full=A.length+B.length+C.length;
  if(state.scope==='view'&&map){ const X=inBox(), inb=it=>it.gas!=null?inView(it.p):(it.r.y<=X.n&&it.r.y>=X.s&&it.r.x>=X.w&&it.r.x<=X.e); [A,B,C].forEach(arr=>{ const k=arr.filter(inb); arr.length=0; arr.push(...k); }); }
  const shown=A.length+B.length+C.length, toAll=n=>`<a href="#" class="toAll">대전 전체에 ${n.toLocaleString()}곳</a>`;
  if(!shown&&full){ list.innerHTML=`<div class="empty">이 지도 안에는 없어요 · ${toAll(full)}</div>`; bindAll(list); cnt.textContent='검색 0곳'; return; }
  [A,B,C].forEach(ord);
  const row=it=>it.gas!=null?gasRow(it.gas,cy,cx):itemRow(it.r,cy,cx);
  // 분류를 아무것도 안 골랐거나 대분류 '전체'면: 구역 없이 쭉
  const flat=U.every||(!S.size&&!gasOn());
  if(flat){ const L=[...A,...B,...C]; ord(L); const lf=renderSearch.lim?renderSearch.lim.A:60;
    list.innerHTML=(L.length?L.slice(0,lf).map(row).join('')+(L.length>lf?`<button class="morebtn" data-more="A">더 보기 (${(L.length-lf).toLocaleString()}곳)</button>`:''):'<div class="nores">검색 결과 없음</div>');
    if(shown<full) list.insertAdjacentHTML('beforeend',`<div class="empty">이 지도 밖에도 있어요 · ${toAll(full)}</div>`); bindAll(list);
    list.querySelectorAll('[data-more]').forEach(b=>b.addEventListener('click',()=>{ renderSearch.lim={A:lf+60,B:3,C:3}; renderSearch(list,cnt,cy,cx); }));
    cnt.textContent=`검색 ${shown.toLocaleString()}곳`; return; }
  const selNames=[...(gasOn()?[GAS]:[]),...U.sel.filter(g=>g!==GAS).flatMap(g=>U.all[g]?[g+' 전체']:(U.subs[g]||[]))];
  const sec=(t,sub,arr,few,id)=>`<div class="sec">${t}${sub?` <small>${e(sub)}</small>`:''}</div>`+(arr.length?arr.slice(0,few).map(row).join('')+(arr.length>few?`<button class="morebtn" data-more="${id}">더 보기 (${(arr.length-few).toLocaleString()}곳)</button>`:''):'<div class="nores">검색 결과 없음</div>');
  const lim=renderSearch.lim||{A:40,B:3,C:3};
  const selGn=U.sel.filter(g=>g!==GAS&&!U.all[g]);   // 소분류가 '전체'인 대분류는 '다른 업종'이 없음
  list.innerHTML=sec('선택한 업종',selNames.join(' · '),A,lim.A,'A')+(selGn.length?sec(`${selGn.join('·')}의 다른 업종`,'',B,lim.B,'B'):'')+sec('그 밖의 업종','',C,lim.C,'C');
  if(shown<full) list.insertAdjacentHTML('beforeend',`<div class="empty">이 지도 밖에도 있어요 · ${toAll(full)}</div>`); bindAll(list);
  list.querySelectorAll('[data-more]').forEach(b=>b.addEventListener('click',()=>{ renderSearch.lim=Object.assign({},lim,{[b.dataset.more]:lim[b.dataset.more]+40}); renderSearch(list,cnt,cy,cx); }));
  cnt.textContent=`검색 ${shown.toLocaleString()}곳`; }
renderSearch.n=0;
function bindAll(list){ list.querySelectorAll('.toAll').forEach(a=>a.addEventListener('click',ev=>{ ev.preventDefault(); state.scope='all'; savePref(); syncFilterUI(); renderList(); })); }
document.getElementById('q').addEventListener('input',()=>{ renderSearch.lim=null; });
document.getElementById('list').addEventListener('click',ev=>{ const it=ev.target.closest('.item[data-r]'); if(!it) return; ev.stopImmediatePropagation();
  const [g,k]=it.dataset.r.split(':').map(Number); const r=ROWS[g]&&ROWS[g][k]; if(r) openRow(r,true); },true);
// 검색하면 분류 접고 리스트를 '준비 중' 칩 아래까지 올림
const qEl=document.getElementById('q');
qEl.addEventListener('focus',()=>{ collapse(); if(innerWidth<=820){ const st=document.querySelector('.status').getBoundingClientRect(); panelEl().style.height=(innerHeight-st.bottom-8)+'px'; panelEl().classList.remove('min'); document.body.classList.remove('min'); } });
qEl.addEventListener('blur',()=>{ if(!qEl.value.trim()) panelEl().style.height=''; });
const _setPanel=setPanel; setPanel=function(min){ if(min||!state.q) panelEl().style.height=''; _setPanel(min); setTimeout(()=>{ fit(); drawOdt(); },280); };

// ---- 새로 그리기 ----
const _render=render; render=function(){ _render(); if(mixed()) markers.forEach((m,i)=>{ if(i!==selI) m.setMap(null); }); drawOdt(); };
const _ll=layoutLabels; layoutLabels=function(){ if(mixed()){ LBL.forEach(o=>{ if(o&&o.__on){ o.setMap(null); o.__on=false; } }); return; } _ll(); };
const _oc=openCard; openCard=function(i,pan){ _oc(i,pan); if(mixed()) markers[i].setMap(map); };
function refresh(){ LIMIT=60; render(); }
// 지도 준비되면: 주유 핀 바꾸기, 이동·확대 때 다시 그리기, 끌면 분류 접기
(function wait(){ if(typeof map==='undefined'||!map||!markers.length) return setTimeout(wait,120);
  ['ok','no','check'].forEach(c=>{ imgs[c]=gasPin(c); imgsBig[c]=gasPin(c,true); }); markers.forEach((m,i)=>m.setImage(imgFor(i)));
  K.event.addListener(map,'idle',()=>{ drawOdt(); if(state.q) renderList(); });   // 검색 중 지도를 옮기면 범위·가까운 순 다시
  K.event.addListener(map,'dragstart',()=>{ collapse(); closeStack(); });
  K.event.addListener(map,'click',()=>{ closeStack(); });
  refresh(); })();
// 데이터 목록
fetch('odt/meta.json?t='+Math.floor(Date.now()/3600000)).then(r=>r.json()).then(m=>{ META=m; META.subIdx={}; m.subs.forEach(([g,s],i)=>{ META.subIdx[m.groups[g]+'|'+s]=i; });
  if(m.fake){ const b=document.createElement('div'); b.className='fakebar'; b.textContent='시험판 · 다른 업종 위치는 가짜예요'; document.querySelector('.status').appendChild(b); }
  ensure(wantG()).then(refresh); }).catch(()=>{});
addEventListener('resize',fit);
draw(); window.__ac={U,saveU};   // 시험용
})();
</script>
