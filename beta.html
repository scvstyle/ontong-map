function parseCSV(t){ const rows=[];let row=[],f='',q=false; for(let i=0;i<t.length;i++){const c=t[i]; if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; } else { if(c=='"') q=true; else if(c==','){row.push(f);f='';} else if(c=='\n'){row.push(f);rows.push(row);row=[];f='';} else if(c!='\r') f+=c; } } if(f||row.length){row.push(f);rows.push(row);} return rows; }

function applyReport(p,result,ts){

  else if(result===POS || result==='캐시백 됐어요') say = b==='no' ? '캐시백이 됐다는' : null;

}

async function fetchStable(url,key){ const t=await fetch(url+'&t='+Date.now()).then(r=>{ if(!r.ok) throw new Error('csv'); return r.text(); });

  if(c&&c.rows&&c.rows.length>rows.length&&Date.now()-c.at<1800000) return c.rows;
  try{ localStorage.setItem('csv:'+key, JSON.stringify({at:Date.now(),rows})); }catch(_){} return rows; }

  markers = DATA.map((p,i)=>{ const m=new kakao.maps.Marker({position:new kakao.maps.LatLng(p.y,p.x), image:imgs[p.c], title:p.n, zIndex:p.c==='no'?1:3}); kakao.maps.event.addListener(m,'click',()=>openCard(i,false)); return m; });
  kakao.maps.event.addListener(map,'click',()=>{ closeCard(); closeInfo(); });
  kakao.maps.event.addListener(map,'dragstart',()=>{ closeCard(); closeInfo(); });
  kakao.maps.event.addListener(map,'idle',layoutLabels);
  if(lastPos) startAtMe(); else centerOn(new kakao.maps.LatLng(START.city.y,START.city.x), START.city.level);
  render();
  loadReports(); loadPrices();
});

// ===== 안내창: 공지사항 · 자유게시판 · 운영자에게 말하기 =====
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(_){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}}};
const rid=(n=10)=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>'0123456789abcdefghijklmnopqrstuvwxyz'[x%36]).join('');};
async function sha16(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16); }
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return String(h>>>0); }
// 시트 시간 '2026. 11. 7 오후 2:40:12' 또는 '2026-11-07' → 밀리초(한국시간 기준)
function parseKT(s){ s=String(s||'').trim(); if(/^\d{5}(\.\d+)?$/.test(s)) return Math.round((+s-25569)*864e5-9*3600e3);  // 시트 날짜 숫자(일련번호)
  const m=s.match(/^(\d{4})[.\-]\s*(\d{1,2})[.\-]\s*(\d{1,2})\.?(?:\s*(오전|오후)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?)?/); if(!m) return 0;
  let h=+(m[5]||0); if(m[4]==='오후'&&h<12) h+=12; if(m[4]==='오전'&&h===12) h=0; return Date.UTC(+m[1],+m[2]-1,+m[3],h-9,+(m[6]||0),+(m[7]||0)); }
function ago(t){ const d=(Date.now()-t)/1000; if(d<60) return '방금'; if(d<3600) return Math.floor(d/60)+'분 전'; if(d<86400) return Math.floor(d/3600)+'시간 전'; const k=new Date(t+9*3600e3); return `${k.getUTCMonth()+1}/${k.getUTCDate()}`; }
const REPORT_HIDE=5, MAXLEN=30000;
const ADJ=['조용한','부지런한','느긋한','씩씩한','상냥한','수줍은','명랑한','든든한','재빠른','꼼꼼한','유쾌한','차분한','용감한','다정한','엉뚱한','성실한','반짝이는','포근한','당찬','슬기로운'];
const ANI=['고라니','너구리','수달','다람쥐','참새','두더지','고양이','강아지','부엉이','거북이','판다','펭귄','토끼','여우','곰','오리','해달','올빼미','고슴도치','코알라'];
function myNick(){ let n=LS.get('nick',''); if(!n){ const a=new Uint8Array(3); crypto.getRandomValues(a); n=`${ADJ[a[0]%ADJ.length]} ${ANI[a[1]%ANI.length]} ${10+a[2]%90}`; LS.set('nick',n);} return n; }
function myDev(){ let d=LS.get('dev',''); if(!d){ d=rid(12); LS.set('dev',d);} return d; }
// 도배 방지(아주 느슨하게): 10분에 100번, 같은 글은 1시간 안에 다시 못 보냄
function sendBlock(text){ const now=Date.now(); const s=LS.get('sends',[]).filter(t=>now-t<600000); if(s.length>=100) return '10분 동안 너무 많이 보냈어요. 조금 뒤에 다시 보내 주세요.';
  if(text){ const h=LS.get('texts',{}); const k=hashStr(text.trim()); if(h[k]&&now-h[k]<3600000) return '같은 내용을 조금 전에 보냈어요.'; } return ''; }
function markSent(text){ const now=Date.now(); const s=LS.get('sends',[]).filter(t=>now-t<600000); s.push(now); LS.set('sends',s);
  if(text){ const h=LS.get('texts',{}); for(const k in h) if(now-h[k]>3600000) delete h[k]; h[hashStr(text.trim())]=now; LS.set('texts',h);} }
function formSend(type,nick,meta,text,e){ const b=new URLSearchParams(); b.set(FORM.result,'__other_option__'); b.set(FORM.result+'.other_option_response',type);
  if(nick) b.set(FORM.name,nick); if(meta) b.set(FORM.addr,meta); if(text||e) b.set(FORM.comment,text||e); return fetch(FORM.action,{method:'POST',mode:'no-cors',body:b}).catch(()=>{}); }
function pend(type,nick,meta,text){ const p=LS.get('pend',[]); p.push({t:Date.now(),type,nick,meta,text:text||''}); LS.set('pend',p); }
function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function dlg(msg,okText,cancelText){ return new Promise(res=>{ const d=document.createElement('div'); d.className='dlg';
  d.innerHTML=`<div><div>${msg}</div><div class="bt">${cancelText?`<button class="btn" data-v="0">${cancelText}</button>`:''}<button class="btn pri" data-v="1">${okText||'확인'}</button></div></div>`;
  d.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b||e.target===d){ d.remove(); res(!!b&&b.dataset.v==='1'); } }); document.body.appendChild(d); }); }

// --- 공지사항 ---
let NOTICES=[];
async function loadNotices(){ if(!FORM||!FORM.notice) return; try{
  NOTICES=(await fetchStable(FORM.notice,'notice')).slice(1).map((r,i)=>({d:r[0]||'',t:parseKT(r[0]),title:(r[1]||'').trim(),body:r[2]||'',i})).filter(n=>n.title).sort((a,b)=>b.t-a.t||b.i-a.i); }catch(_){} markNoticeDot(); }
const noticeKey=n=>n?(n.d+'|'+n.title):'';
function markNoticeDot(){ const unseen=NOTICES.length&&LS.get('seenNotice','')!==noticeKey(NOTICES[0]); const b=document.getElementById('infoBtn'); let d=b.querySelector('.ndot'); if(unseen&&!d){ d=document.createElement('span'); d.className='ndot'; b.appendChild(d);} if(!unseen&&d) d.remove(); return unseen; }
function noticeHtml(){ if(!NOTICES.length) return '<div class="empty">아직 공지가 없어요.</div>'; const seen=LS.get('seenNotice','');
  const html=NOTICES.map((n,k)=>`<details class="nt" ${k===0?'open':''}><summary><span class="d">${esc(n.t?shortDate(n.d)||n.d:n.d)}</span><span class="tt">${esc(n.title)}${k===0&&seen!==noticeKey(n)?'<span class="new">NEW</span>':''}</span></summary><div class="bd">${esc(n.body)}</div></details>`).join('');
  LS.set('seenNotice',noticeKey(NOTICES[0])); markNoticeDot(); return html; }

// --- 자유게시판 ---
let BRD={rows:[],at:0,err:false}, bv={post:null,replyTo:null};
async function loadBoard(force){ if(!FORM||!FORM.board) return; if(!force&&Date.now()-BRD.at<20000) return;
  try{ BRD.rows=(await fetchStable(FORM.board,'board')).slice(1).filter(r=>r[1]).map(r=>({t:parseKT(r[0]),type:r[1],nick:r[2]||'',meta:r[3]||'',text:r[4]||''})); BRD.at=Date.now(); BRD.err=false; }
  catch(_){ BRD.err=true; } }
async function boardModel(){
  const have=new Set(BRD.rows.map(r=>r.type+'|'+r.meta)), now=Date.now();
  const fresh=LS.get('pend',[]).filter(p=>now-p.t<1800000&&!have.has(p.type+'|'+p.meta)); LS.set('pend',fresh);
  const rows=[...BRD.rows,...fresh.map(p=>({...p,local:true}))].sort((a,b)=>a.t-b.t);
  const items={}, posts=[], acts={};
  for(const r of rows){ const f=r.meta.split('|');
    if(r.type==='게시글'&&f[0]==='p'&&f[1]) posts.push(items[f[1]]={id:f[1],kind:'p',nick:r.nick,t:r.t,text:r.text,owner:f[2]||'',kids:[],all:[],local:r.local});
    else if(r.type==='댓글'&&f[0]==='c'&&f[1]) items[f[1]]={id:f[1],kind:'c',post:f[2],parent:f[3]||'',nick:r.nick,t:r.t,text:r.text,owner:f[4]||'',kids:[],local:r.local};
    else if(['삭제','신고','운영자 숨김','운영자 복구'].includes(r.type)) (acts[f[0]]=acts[f[0]]||[]).push({type:r.type,t:r.t,x:f[1]||''}); }
  for(const id in acts){ const it=items[id]; if(!it) continue; const a=acts[id];
    for(const d of a) if(d.type==='삭제'&&d.x&&it.owner&&(await sha16(d.x))===it.owner) it.deleted=true;
    const ops=a.filter(x=>x.type.startsWith('운영자')), last=ops[ops.length-1];
    if(last&&last.type==='운영자 숨김') it.hidden=true;
    else { const since=last?last.t:0; it.reports=new Set(a.filter(x=>x.type==='신고'&&x.t>=since).map(x=>x.x)).size; if(it.reports>=REPORT_HIDE) it.hidden=true; } }
  for(const id in items){ const c=items[id]; if(c.kind!=='c') continue; const p=items[c.post]; if(!p||p.kind!=='p') continue; p.all.push(c); const par=c.parent&&items[c.parent]; (par&&par.kind==='c'?par.kids:p.kids).push(c); }
  posts.sort((a,b)=>b.t-a.t); return {items,posts:posts.filter(p=>!p.deleted)}; }
const mine=id=>LS.get('mine',{})[id];
const alive=c=>!c.deleted;
function canDelete(it,M){ if(it.kind==='p') return !it.all.some(alive); const p=M.items[it.post]; return !(p&&p.all.some(c=>c!==it&&alive(c)&&c.t>=it.t)) && !it.kids.some(alive); }
function actsHtml(it){ const me=mine(it.id), rep=LS.get('rep',{})[it.id];
  return `<div class="acts">${it.kind==='c'?`<button data-a="reply" data-id="${it.id}">답글</button>`:''}${me?`<button data-a="del" data-id="${it.id}">삭제</button>`:`<button data-a="rep" data-id="${it.id}" ${rep?'disabled':''}>${rep?'신고함':'신고'}</button>`}${OPS?(it.hidden?`<button data-a="show" data-id="${it.id}">운영자: 복구</button>`:`<button data-a="hide" data-id="${it.id}">운영자: 숨기기</button>`):''}</div>`; }
function metaHtml(it){ return `<div class="meta"><b>${esc(it.nick||'익명')}</b><span>${ago(it.t)}</span>${it.local?'<span class="tag loc">올리는 중 · 다른 사람에겐 1~5분 뒤 보여요</span>':''}${OPS&&it.hidden?'<span class="tag hid">숨김</span>':''}${OPS&&it.reports?`<span class="tag">신고 ${it.reports}</span>`:''}</div>`; }
async function boardHtml(){
  await loadBoard(); const M=await boardModel(); const nick=myNick();
  if(bv.post){ const p=M.items[bv.post]; if(!p||p.deleted||(p.hidden&&!OPS)){ bv.post=null; return boardHtml(); }
    const cm=(c,depth,pnick)=>{ const shown=alive(c)&&(!c.hidden||OPS); const kids=c.kids.map(k=>cm(k,depth+1,c.nick)).join('');
      if(!shown&&!kids) return ''; const d=Math.min(depth,2);
      const body=shown?`${metaHtml(c)}<div class="txt">${depth>=2?`<span class="at">@${esc(pnick)}</span> `:''}${esc(c.text)}</div>${actsHtml(c)}`:`<div class="gone">${c.deleted?'삭제된 댓글이에요.':'신고가 많아 가려진 댓글이에요.'}</div>`;
      return `<div class="cm d${d}">${body}</div>${kids}`; };
    const cms=p.kids.map(c=>cm(c,0,p.nick)).join('');
    const to=bv.replyTo&&M.items[bv.replyTo];
    return `<button class="back" data-a="list">← 목록</button>${metaHtml(p)}<div class="txt">${esc(p.text)}</div>${actsHtml(p)}
      <div class="cmts">${cms||'<div class="empty">첫 댓글을 남겨 보세요.</div>'}</div>
      <div class="cw">${to?`<div class="to">↳ <b>${esc(to.nick)}</b>님에게 답글 <button data-a="noreply">×</button></div>`:''}<textarea class="ta" id="cmtText" maxlength="${MAXLEN}" placeholder="${to?'답글을 남겨 주세요':'댓글을 남겨 주세요'}"></textarea>
      <div class="wrow"><span>${esc(nick)}</span><span class="sp"></span><button class="btn pri" data-a="cmt">${to?'답글 달기':'댓글 달기'}</button></div></div>`; }
  const list=M.posts.filter(p=>!p.hidden||OPS).map(p=>{ const n=p.all.filter(c=>alive(c)&&(!c.hidden||OPS)).length;
    return `<div class="post" data-a="open" data-id="${p.id}">${metaHtml(p)}<div class="txt">${esc(p.text)}</div><div class="meta">댓글 ${n}</div></div>`; }).join('');
  return `<div class="wr"><textarea class="ta" id="postText" maxlength="${MAXLEN}" placeholder="자유롭게 이야기해 주세요"></textarea>
    <div class="wrow"><span>내 별명: ${esc(nick)}</span><span class="sp"></span><button class="btn pri" data-a="post">올리기</button></div></div>
    <div class="bhead"><span>${BRD.err?'글을 불러오지 못했어요.':`글 ${M.posts.filter(p=>!p.hidden||OPS).length}개`}</span><span class="sp"></span><button data-a="refresh">새로고침</button></div>
    ${list||'<div class="empty">아직 글이 없어요.<br>첫 글을 남겨 보세요!</div>'}`; }
async function boardAct(a,id){
  const M=await boardModel(), it=id&&M.items[id];
  if(a==='open'){ bv.post=id; bv.replyTo=null; return renderModal(true); }
  if(a==='list'){ bv.post=null; bv.replyTo=null; return renderModal(true); }
  if(a==='refresh'){ await loadBoard(true); return renderModal(); }
  if(a==='reply'){ bv.replyTo=id; await renderModal(); const t=document.getElementById('cmtText'); if(t) t.focus(); return; }
  if(a==='noreply'){ bv.replyTo=null; return renderModal(); }
  if(a==='post'||a==='cmt'){ const ta=document.getElementById(a==='post'?'postText':'cmtText'); const text=(ta.value||'').trim(); if(!text) return toast('내용을 적어 주세요.');
    const why=sendBlock(text); if(why) return dlg(why);
    const nid=rid(), secret=rid(16), owner=await sha16(secret); const m=LS.get('mine',{}); m[nid]=secret; LS.set('mine',m);
    const meta=a==='post'?`p|${nid}|${owner}`:`c|${nid}|${bv.post}|${bv.replyTo||''}|${owner}`; const type=a==='post'?'게시글':'댓글';
    formSend(type,myNick(),meta,text); pend(type,myNick(),meta,text); markSent(text); ta.value='';
    if(a==='cmt') bv.replyTo=null; toast(a==='post'?'올렸어요!':'댓글을 달았어요!'); return renderModal(); }
  if(!it) return;
  if(a==='del'){ if(!canDelete(it,M)) return dlg(`${it.kind==='p'?'댓글이 달린 글':'뒤에 댓글이 달린 댓글'}이라 직접 지울 수 없어요.<br>지우고 싶으면 '운영자에게 말하기'로 요청해 주세요.`);
    if(!await dlg(`이 ${it.kind==='p'?'글':'댓글'}을 지울까요?`,'지우기','취소')) return;
    const meta=`${id}|${mine(id)}`; formSend('삭제','',meta,''); pend('삭제','',meta,''); if(it.kind==='p') bv.post=null; toast('지웠어요.'); return renderModal(); }
  if(a==='rep'){ if(!await dlg(`이 ${it.kind==='p'?'글':'댓글'}을 신고할까요?<br>서로 다른 사람의 신고가 ${REPORT_HIDE}번 쌓이면 가려져요.`,'신고하기','취소')) return;
    const why=sendBlock(''); if(why) return dlg(why); const meta=`${id}|${myDev()}`; formSend('신고','',meta,''); pend('신고','',meta,''); markSent('');
    const r=LS.get('rep',{}); r[id]=1; LS.set('rep',r); toast('신고했어요.'); return renderModal(); }
  if(OPS&&(a==='hide'||a==='show')){ const type=a==='hide'?'운영자 숨김':'운영자 복구'; formSend(type,'',id,'',OPS_TOKEN); pend(type,'',id,''); toast(a==='hide'?'숨겼어요.':'복구했어요.'); return renderModal(); }
}

// --- 운영자에게 말하기 ---
function talkHtml(){ return `<div class="talk"><textarea class="ta" id="talkText" maxlength="${MAXLEN}" style="min-height:180px" placeholder="고칠 점, 제안, 협업 문의 등 무엇이든 편하게 적어 주세요."></textarea>
  <div class="wrow"><span class="sp"></span><button class="btn" data-a="talkcancel">취소</button><button class="btn pri" data-a="talksend">보내기</button></div></div>`; }
async function talkAct(a){ const ta=document.getElementById('talkText');
  if(a==='talkcancel'){ ta.value=''; return closeModal(); }
  const text=(ta.value||'').trim(); if(!text) return toast('내용을 적어 주세요.'); const why=sendBlock(text); if(why) return dlg(why);
  formSend('운영자에게 말하기','','',text); markSent(text); ta.value=''; dlg('보냈어요. 고마워요!'); }

// --- 창 열고 닫기 ---
let mtab='notice';
async function renderModal(top){ const b=document.getElementById('mbody'); const keep=top?0:b.scrollTop;
  document.querySelectorAll('.mtabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===mtab));
  const draft={}; ['postText','cmtText','talkText'].forEach(k=>{ const e=document.getElementById(k); if(e) draft[k]=e.value; });
  b.innerHTML = mtab==='notice' ? noticeHtml() : mtab==='board' ? (b.innerHTML.includes('class="wr"')||b.innerHTML.includes('class="cw"') ? b.innerHTML : '<div class="empty">불러오는 중…</div>') : talkHtml();
  if(mtab==='board') b.innerHTML = await boardHtml();
  for(const k in draft){ const e=document.getElementById(k); if(e&&!e.value) e.value=draft[k]; }
  b.scrollTop=keep; document.getElementById('mdesc').innerHTML=`<b style="color:var(--ink)">온통대전 앱의 캐시백 표시를 옮긴 비공식 지도예요.</b> 결제 전 앱에서 한 번 더 확인하세요. 가맹점 앱 표시 기준 2026-11-05${PU?` · 가격 오피넷 ${esc(when(PU))}`:''}`; }
function openModal(tab){ mtab=tab||(markNoticeDot()?'notice':(mtab||'notice')); bv.post=null; bv.replyTo=null; document.getElementById('modal').hidden=false; closeCard(); renderModal(true); }
function closeModal(){ document.getElementById('modal').hidden=true; }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal'||e.target.closest('.mx')) return closeModal();
  const tb=e.target.closest('.mtabs button'); if(tb){ mtab=tb.dataset.t; bv.post=null; bv.replyTo=null; return renderModal(true); }
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a;
  if(a.startsWith('talk')) return talkAct(a); boardAct(a, el.dataset.id); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!document.getElementById('modal').hidden&&!document.querySelector('.dlg')) closeModal(); });
loadNotices();
</script>
