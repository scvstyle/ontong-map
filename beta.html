<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>온통대전 캐시백 지도</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --sub:#5b6470; --line:#e4e7eb;
    --ok:#0f9d8a; --ok-soft:#e3f5f2; --chk:#d98a00; --chk-soft:#fdf2dc; --no:#8a939e; --no-soft:#eef0f2; --accent:#0f9d8a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:grid;grid-template-rows:1fr;height:100%;height:100dvh}
  /* 지도 위에 띄운 제목·필터 */
  .top{position:absolute;left:10px;top:10px;z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;max-width:calc(100% - 20px)}
  .status{position:absolute;right:10px;top:10px;z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .top>*{pointer-events:auto}
  .pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(0,0,0,.06);border-radius:999px;padding:6px 6px 6px 15px;box-shadow:0 2px 10px rgba(0,0,0,.14)}
  .pill h1{font-size:15.5px;margin:0;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
  .pill .i{width:24px;height:24px;border-radius:50%;border:0;background:#eef0f2;color:var(--sub);font:700 13px/24px Pretendard,sans-serif;cursor:pointer;padding:0}
  .bar{display:flex;gap:6px;padding:2px}
  .bar::-webkit-scrollbar{display:none}
  .bar .seg{margin:0;border-radius:999px;box-shadow:0 1px 6px rgba(0,0,0,.14);border-color:rgba(0,0,0,.06)}
  .bar .seg button{padding:6px 11px;font-size:13px}
  .chips{display:flex;gap:6px}
  .info{max-width:min(340px,calc(100vw - 20px));background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.16);padding:10px 12px;font-size:12.5px;color:var(--sub);line-height:1.5}
  .info b{color:var(--ink)} .info a{color:var(--ok);font-weight:600}
  /* 가격 말풍선 */
  .lbw{position:relative;width:0;height:0}
  .lb{position:absolute;display:flex;align-items:center;gap:4px;height:24px;padding:0 8px;background:#fff;border:1.5px solid var(--ok);border-radius:12px;font:700 12.5px/1 Pretendard,sans-serif;color:var(--ink);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
  .lb.c-no{border-color:var(--no)} .lb.c-check{border-color:var(--chk)}
  .lb-t{left:0;top:-9px;transform:translate(-50%,-100%)} .lb-b{left:0;top:9px;transform:translate(-50%,0)} .lb-r{left:9px;top:0;transform:translate(0,-50%)} .lb-l{left:-9px;top:0;transform:translate(-100%,-50%)}
  .lb .m{width:16px;height:16px;border-radius:50%;font:700 10px/16px Pretendard,sans-serif;color:#fff;text-align:center;font-style:normal}
  .m1{background:#e5a800} .m2{background:#98a2ad} .m3{background:#c0743a}
  .chip{border:1px solid rgba(0,0,0,.06);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--sub);display:inline-flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;flex:none;box-shadow:0 1px 6px rgba(0,0,0,.14)}
  .chip.on{background:#fff}
  .chip.on{border-color:var(--ink);color:var(--ink);font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .main{display:grid;grid-template-columns:360px 1fr;min-height:0}
  aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .search{padding:10px 12px;border-bottom:1px solid var(--line)}
  .search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
  .search input:focus{border-color:var(--accent)}
  .count{font-size:12.5px;color:var(--sub);padding:8px 14px 4px}
  .countrow{display:flex;align-items:center;gap:8px;padding-right:12px} .countrow .count{flex:1}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;margin-top:4px}
  .seg button{border:0;background:#fff;padding:4px 10px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--sub)} .seg button.on{background:var(--ink);color:#fff;font-weight:600}
  .item .pr{grid-row:1 / span 2;grid-column:3;text-align:right;align-self:center;white-space:nowrap} .item .pr b{font-size:15px} .item .pr small{font-size:12px;color:var(--sub);margin-left:1px}
  .card .price{margin:8px 0 2px;border:1px solid var(--line);border-radius:10px;padding:7px 10px} .card .price .pl{display:flex;justify-content:space-between;gap:8px;margin:2px 0} .card .price .eff{color:var(--ok);font-weight:700} .card .price .src{font-size:11px;color:var(--sub);margin-top:3px}
  .list{overflow:auto;flex:1}
  .item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px}
  .item:hover,.item.sel{background:#f2f6f5}
  .item .badge{grid-row:span 2;align-self:start;margin-top:2px;font-size:11px;font-weight:700;border-radius:6px;padding:3px 6px;white-space:nowrap}
  .b-ok{background:var(--ok-soft);color:var(--ok)} .b-chk{background:var(--chk-soft);color:var(--chk)} .b-no{background:var(--no-soft);color:#5b6470}
  .item .nm{font-size:14.5px;font-weight:600}
  .item .ad{font-size:12.5px;color:var(--sub)}
  #map{width:100%;height:100%;min-height:0}
  .mapwrap{position:relative;min-height:0}
  .ctrls{position:absolute;right:10px;bottom:24px;z-index:3;display:flex;flex-direction:column;gap:8px}
  .ctrl{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow:hidden}
  .ctrl button{width:40px;height:40px;border:0;background:#fff;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;font-family:inherit}
  .ctrl button+button{border-top:1px solid var(--line)}
  .ctrl button:active{background:#f2f6f5}
  .ctrl button.on svg{color:#2f6fed}
  .notice{position:absolute;left:12px;bottom:24px;z-index:3;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--sub);max-width:min(420px,70%);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .card{position:relative;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:14px 16px 12px;width:300px;font-size:13px;line-height:1.45;transform:translateY(-17px)}
  .card:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
  .card h3{margin:2px 22px 4px 0;font-size:15.5px}
  .card .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:18px;color:#999;cursor:pointer}
  .card .row{color:var(--sub);margin:2px 0}
  .card .why{background:var(--chk-soft);color:#8a5a00;border-radius:8px;padding:6px 8px;margin:8px 0 4px;font-size:12.5px}
  .card details{margin-top:6px;color:var(--sub);font-size:12px}
  .card .links{display:flex;gap:8px;margin-top:10px}
  .card .links a{flex:1;text-align:center;text-decoration:none;font-weight:600;font-size:13px;border-radius:9px;padding:8px 0;border:1px solid var(--line);color:var(--ink)}
  .card .links a.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .vote{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
  .vote .q{font-size:12px;color:var(--sub);margin-bottom:6px}
  .vote .vb{display:flex;gap:6px}
  .vote .vb button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .vote .vb button:hover{background:#f2f6f5}
  .vote button:disabled{opacity:.5;cursor:default}
  .vote .ops{display:block;width:100%;margin-top:6px;border:1px dashed var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:9px;padding:7px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .vote .msg{font-size:12px;color:var(--ok);font-weight:600;margin-top:4px;min-height:1em}
  .notice a{color:var(--ok);font-weight:600}
  .tabs{display:none}
  .grip{display:none}
  @media (max-width:820px){
    .main{grid-template-columns:1fr;grid-template-rows:1fr}
    aside{position:fixed;left:0;right:0;bottom:0;height:42%;z-index:6;border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.08);transition:height .2s}
    aside.min{height:96px}
    .grip{display:flex;justify-content:center;align-items:center;height:24px;flex:none;cursor:pointer;touch-action:none} .grip span{width:44px;height:5px;border-radius:3px;background:#c4cad1}
    .chip{font-size:12.5px;padding:6px 10px} .bar .seg button{padding:6px 10px}
    /* 내 위치 버튼은 목록 패널 바로 위에 붙어 같이 오르내려요. 폰은 손가락 확대라 +/− 없음 */
    .ctrls{position:fixed;bottom:calc(42% + 12px);transition:bottom .2s;z-index:5} body.min .ctrls{bottom:108px} .zoomctl{display:none}
    .card{width:270px}
  }
</style>
</head>

function parseCSV(t){ const rows=[];let row=[],f='',q=false; for(let i=0;i<t.length;i++){const c=t[i]; if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; } else { if(c=='"') q=true; else if(c==','){row.push(f);f='';} else if(c=='\n'){row.push(f);rows.push(row);row=[];f='';} else if(c!='\r') f+=c; } } if(f||row.length){row.push(f);rows.push(row);} return rows; }
function shortDate(ts){ const m=String(ts).match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/); return m?`${+m[2]}/${+m[3]}`:''; }
// 가장 최근 제보가 이김: 앱 표시와 어긋나는 제보면 '확인 필요', 맞는 제보·운영자 확인이면 앱 표시대로
function applyReport(p,result,ts){
  if(!p.c0){ p.c0=p.c; p.r0=p.r; }
  const b=p.c0; let say=null;
  if(result==='문을 닫았어요') say='문을 닫았다는';
  else if(result==='캐시백 안 됐어요') say = b==='no' ? null : '캐시백이 안 됐다는';
  else if(result===POS || result==='캐시백 됐어요') say = b==='no' ? '캐시백이 됐다는' : null;
  else if(result!==OPS_VAL) return;
  if(say){ p.c='check'; p.rep=`이용자 제보: ${say} 제보가 있어요${ts?' ('+ts+')':''}`; }
  else { p.c=p.c0; p.r=p.r0; delete p.rep; }
}
function loadReports(){
  if(!FORM||!FORM.reports) return;
  fetch(FORM.reports+'&t='+Math.floor(Date.now()/60000)).then(r=>r.ok?r.text():'').then(t=>{
    const rows=parseCSV(t).slice(1); const last={};
    for(const r of rows){ if(r.length<4) continue; last[r[3].trim()]={res:r[1].trim(),ts:shortDate(r[0])}; }
    let changed=false;
    DATA.forEach(p=>{ const L=last[p.a]; if(L){ applyReport(p,L.res,L.ts); changed=true; } });
    if(changed){ markers.forEach((m,i)=>m.setImage(imgFor(i))); render(); }
  }).catch(()=>{});
}
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function vote(i,result,ops){
  const p=DATA[i], key='vote:'+p.ap, msg=document.getElementById('votemsg');
  const prev=lsGet(key);
  if(!ops && prev && Date.now()-(+prev)<30*864e5){ msg.textContent='이미 알려주셨어요. 고마워요!'; return; }
  const body=new URLSearchParams(); body.set(FORM.name,p.n); body.set(FORM.addr,p.a);
  if(result===OPS_VAL){ body.set(FORM.result,'__other_option__'); body.set(FORM.result+'.other_option_response',OPS_VAL); } else body.set(FORM.result,result);
  document.querySelectorAll('.vote button').forEach(b=>b.disabled=true);
  msg.textContent='보내는 중…';
  fetch(FORM.action,{method:'POST',mode:'no-cors',body}).then(()=>{ if(!ops) lsSet(key,String(Date.now())); msg.textContent=ops?'앱 표시대로 되돌렸어요.':'고마워요! 확인 필요로 옮기고 운영자에게 알렸어요.'; const t=new Date(); applyReport(p,result,`${t.getMonth()+1}/${t.getDate()}`); markers[i].setImage(imgFor(i)); render(); })
    .catch(()=>{ msg.textContent='전송에 실패했어요. 잠시 후 다시 눌러 주세요.'; document.querySelectorAll('.vote button').forEach(b=>b.disabled=false); });
}
const state = {ok:true, no:false, check:false, q:'', fuel:'B027'};
// 오피넷 가격 (하루 4번 갱신되는 prices.json). 정가 그대로 보여줘요
const FUEL={B027:'휘발유',D047:'경유',K015:'LPG'};
let PR={}, PU='';
const won = v => v.toLocaleString('ko-KR');
// 고른 유종 가격만 비교해요(LPG와 휘발유를 섞어 줄 세우지 않게)
function priceOf(p){ const s=p.o&&PR[p.o]; const k=state.fuel; const v=s&&s.p&&s.p[k]; return v?{k,v}:null; }
const when = u => { const m=String(u).match(/\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})/); return m?`${+m[1]}/${+m[2]} ${m[3]}`:''; };
function loadPrices(){ fetch('prices.json?t='+Math.floor(Date.now()/600000)).then(r=>r.ok?r.json():null).then(j=>{ if(!j) return; PR=j.st||{}; PU=j.updated||''; render(); }).catch(()=>{}); }
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 작은 점(누르는 범위는 28px). 선택한 곳은 크게
function dotSvg(color,big){
  const r=big?9:6.5, sw=big?3:2;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="${r}" fill="${color}" stroke="#fff" stroke-width="${sw}"/>${big?`<circle cx="14" cy="14" r="${r+2.5}" fill="none" stroke="${color}" stroke-opacity=".35" stroke-width="2"/>`:''}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
// 고른 유종을 파는 곳만: 오피넷 가격이 있으면 그걸로, 없으면 앱 분류(주유소/충전소)로 판단
function sells(p){ const s=p.o&&PR[p.o]; if(s&&s.p&&Object.keys(s.p).length) return !!s.p[state.fuel]; return state.fuel==='K015' ? p.t==='충전소' : p.t!=='충전소'; }
function visible(p){
  if(!state[p.c] || !sells(p)) return false;
  if(state.q){ const h=(p.n+' '+p.kn+' '+p.a+' '+p.ap+' '+p.g+' '+p.rec.map(r=>r.name).join(' ')).toLowerCase(); if(!h.includes(state.q)) return false; }
  return true;
}
let map, overlay, markers=[], imgs={}, imgsBig={}, selI=-1;
const imgFor = i => (i===selI?imgsBig:imgs)[DATA[i].c];
function card(p,i){
  const kakaoLink = p.u || `https://map.kakao.com/link/map/${encodeURIComponent(p.n)},${p.y},${p.x}`;
  const navLink = `https://map.kakao.com/link/to/${encodeURIComponent(p.kn||p.n)},${p.y},${p.x}`;
  const recs = p.rec.map(r=>`${esc(r.name)} — ${r.cashback==='제공'?'캐시백 제공':'미제공'}`).join('<br>');
  return `<div class="card"><button class="x" onclick="closeCard()">×</button>
    <span class="badge ${BADGE[p.c]}" style="font-size:11px;font-weight:700;border-radius:6px;padding:3px 6px">${LABEL[p.c]}</span>
    <h3>${esc(p.n)}</h3>
    <div class="row">${esc(p.a)}</div>
    ${p.b?`<div class="row">${esc(p.b)}${p.t==='충전소'?' · 충전소':''}</div>`:''}
    ${priceBlock(p)}
    ${p.rep?`<div class="why">${esc(p.rep)}</div>`:''}
    ${p.r?`<div class="why">${esc(p.r)}</div>`:''}
    <details><summary>앱에 등록된 이름 (${p.rec.length})</summary>${recs}</details>
    <div class="links"><a href="${kakaoLink}" target="_blank" rel="noopener">카카오맵</a><a class="primary" href="${navLink}" target="_blank" rel="noopener">길찾기</a></div>
    ${FORM?`<div class="vote"><div class="q">${base(p)==='no'?'캐시백이 됐나요?':'정보가 틀렸나요?'}</div><div class="vb">${base(p)==='no'?`<button onclick="vote(${i},POS)">캐시백 됐어요</button>`:`<button onclick="vote(${i},'캐시백 안 됐어요')">캐시백 안 됐어요</button>`}<button onclick="vote(${i},'문을 닫았어요')">문을 닫았어요</button></div>${OPS?`<button class="ops" onclick="vote(${i},OPS_VAL,true)">운영자: 앱 표시대로</button>`:''}<div class="msg" id="votemsg"></div></div>`:''}
  </div>`;
}
function priceBlock(p){ const s=p.o&&PR[p.o]; if(!s) return p.o||!PU?'':'<div class="price"><div class="src">오피넷 가격 정보가 없어요</div></div>';
  const ks=['B027','D047','K015'].filter(k=>s.p&&s.p[k]);
  const rows=ks.map(k=>`<div class="pl"><span>${FUEL[k]}</span><b>${won(s.p[k])}원</b></div>`).join('');
  return `<div class="price">${rows}<div class="src">오피넷 ${esc(when(PU))} 기준</div></div>`; }
// 패널: 카드 열기 직전 상태를 기억했다가 카드가 닫히면 그대로 돌려놔요(카드가 열린 동안 사용자가 직접 바꾸면 그걸 존중)
const panelEl=()=>document.getElementById('panel'); let preCardMin=null;
function setPanel(min){ panelEl().classList.toggle('min',min); document.body.classList.toggle('min',min); setTimeout(layoutLabels,260); }
function hideCard(){ if(overlay){overlay.setMap(null); overlay=null;} document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));
  if(selI>=0&&markers[selI]){ const j=selI; selI=-1; markers[j].setImage(imgFor(j)); markers[j].setZIndex(DATA[j].c==='no'?1:3); layoutLabels(); } selI=-1; }
function closeCard(){ const had=!!overlay; hideCard(); if(had&&preCardMin!==null&&innerWidth<=820) setPanel(preCardMin); preCardMin=null; }
function closeInfo(){ const inf=document.getElementById('info'); if(!inf.hidden){ inf.hidden=true; setTimeout(layoutLabels,0); } }
// 지금 보이는 지도 범위에서 싼 순으로 X곳에 가격 말풍선(같은 가격은 같은 메달, 겹치면 싼 곳 우선)
const LBL=[]; let ctx2d=null;
function textW(s){ if(!ctx2d){ ctx2d=document.createElement('canvas').getContext('2d'); } ctx2d.font='700 12.5px Pretendard, sans-serif'; return ctx2d.measureText(s).width; }
function layoutLabels(){
  if(!map||!map.getProjection) return;
  const proj=map.getProjection(), mw=document.querySelector('.mapwrap').getBoundingClientRect();
  const top=0; let bot=mw.height; if(innerWidth<=820) bot=Math.min(bot, panelEl().getBoundingClientRect().top-mw.top);
  // 지도 위에 떠 있는 제목·유종·상태·버튼 자리는 피해서 놓아요
  const ui=[...document.querySelectorAll('.pill,.bar,.info:not([hidden]),.status,.ctrls')].map(e=>{const r=e.getBoundingClientRect(); return {x1:r.left-mw.left-4,y1:r.top-mw.top-4,x2:r.right-mw.left+4,y2:r.bottom-mw.top+4};}).filter(r=>r.x2>r.x1);
  const hitUI=(b)=>ui.some(o=>b.x1<o.x2&&b.x2>o.x1&&b.y1<o.y2&&b.y2>o.y1);
  const cand=[];
  DATA.forEach((p,i)=>{ if(!visible(p)) return; const pr=priceOf(p); if(!pr) return;
    const pt=proj.containerPointFromCoords(new kakao.maps.LatLng(p.y,p.x));
    if(pt.x<0||pt.x>mw.width||pt.y<top||pt.y>bot||hitUI({x1:pt.x,y1:pt.y,x2:pt.x,y2:pt.y})) return; cand.push({i,v:pr.v,x:pt.x,y:pt.y}); });
  cand.sort((a,b)=>a.v-b.v||a.i-b.i);
  const X=innerWidth<=820?10:20, levels=[...new Set(cand.map(c=>c.v))], boxes=[], placed=[];
  for(const c of cand){ if(placed.length>=X) break; if(c.i===selI) continue; // 카드가 열린 곳은 순위만 세고 말풍선은 숨김
    const rank=levels.indexOf(c.v), medal=rank<3?rank+1:0, txt=won(c.v), w=textW(txt)+19+(medal?20:0), h=25, g=9;
    let got=null;
    for(const pos of ['t','b','r','l']){
      const b = pos==='t'?{x1:c.x-w/2,y1:c.y-g-h}: pos==='b'?{x1:c.x-w/2,y1:c.y+g}: pos==='r'?{x1:c.x+g,y1:c.y-h/2}:{x1:c.x-g-w,y1:c.y-h/2};
      b.x2=b.x1+w; b.y2=b.y1+h;
      if(b.x1<2||b.x2>mw.width-2||b.y1<top||b.y2>bot||hitUI(b)) continue;
      if(boxes.some(o=>b.x1<o.x2&&b.x2>o.x1&&b.y1<o.y2&&b.y2>o.y1)) continue;
      got={pos,b}; break; }
    if(!got) continue; boxes.push(got.b); placed.push({...c,medal,txt,pos:got.pos}); }
  const on=new Set(placed.map(p=>p.i));
  LBL.forEach((o,i)=>{ if(o&&o.__on&&!on.has(i)){ o.setMap(null); o.__on=false; } });
  for(const p of placed){ let o=LBL[p.i];
    if(!o){ const el=document.createElement('div'); el.className='lbw'; el.addEventListener('click',e=>{e.stopPropagation(); openCard(p.i,false);});
      o=LBL[p.i]=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(DATA[p.i].y,DATA[p.i].x), content:el, xAnchor:0, yAnchor:0, zIndex:5, clickable:true}); o.__el=el; }
    o.__el.innerHTML=`<div class="lb lb-${p.pos} c-${DATA[p.i].c}">${p.medal?`<i class="m m${p.medal}">${p.medal}</i>`:''}${p.txt}</div>`;
    if(!o.__on){ o.setMap(map); o.__on=true; } }
}
// 열린 카드가 화면 밖(위 필터·아래 목록·좌우)으로 나가면 지도를 살짝 옮겨 다 보이게
function fitCard(){ const c=document.querySelector('.card'); if(!c||!map.panBy) return;
  const r=c.getBoundingClientRect(), mw=document.querySelector('.mapwrap').getBoundingClientRect();
  const top=Math.max(document.querySelector('.bar').getBoundingClientRect().bottom, document.querySelector('.status').getBoundingClientRect().bottom)+8; let bot=mw.bottom-8;
  if(innerWidth<=820) bot=Math.min(bot, document.getElementById('panel').getBoundingClientRect().top-8);
  let dx=0, dy=0; if(r.top<top) dy=r.top-top; else if(r.bottom>bot) dy=r.bottom-bot;
  if(r.left<mw.left+8) dx=r.left-mw.left-8; else if(r.right>mw.right-8) dx=r.right-mw.right+8;
  if(dx||dy) map.panBy(dx,dy); }
function infoHtml(){ return `<b>온통대전 앱의 캐시백 표시를 옮긴 비공식 지도예요.</b> 결제 전 앱에서 한 번 더 확인하세요.<br>가맹점: 앱 표시 기준 2026-11-05${PU?` · 가격: 오피넷 ${esc(when(PU))}`:''}${FORM?`<br><a href="${reportUrl()}" target="_blank" rel="noopener">정보 제보하기</a>`:''}`; }
function openCard(i, pan){
  const p=DATA[i];
  hideCard(); closeInfo();
  overlay = new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(p.y,p.x), content:card(p,i), yAnchor:1, zIndex:10, clickable:true});
  overlay.setMap(map);
  selI=i; markers[i].setImage(imgFor(i)); markers[i].setZIndex(9);
  if(innerWidth<=820){ if(preCardMin===null) preCardMin=panelEl().classList.contains('min'); setPanel(true); }
  setTimeout(fitCard, pan?450:280); layoutLabels();
  if(pan) map.panTo(new kakao.maps.LatLng(p.y,p.x));
  const el=document.querySelector(`.item[data-i="${i}"]`); if(el){el.classList.add('sel'); el.scrollIntoView({block:'nearest'});}
}
function render(){
  const list=document.getElementById('list'); let n=0, html='';
  const pr=DATA.map(p=>priceOf(p));
  const order=DATA.map((p,i)=>i).filter(i=>visible(DATA[i])).sort((a,b)=>((pr[a]?pr[a].v:1e9)-(pr[b]?pr[b].v:1e9)) || (RANK[DATA[a].c]-RANK[DATA[b].c]) || DATA[a].g.localeCompare(DATA[b].g) || DATA[a].n.localeCompare(DATA[b].n));
  for(const i of order){ const p=DATA[i]; n++;
    html+=`<div class="item" data-i="${i}"><span class="badge ${BADGE[p.c]}">${SHORT[p.c]}</span><div class="nm">${esc(p.n)}</div><div class="ad">${esc(p.g)} · ${esc(p.a.replace(/^대전(광역시)?\s*\S+구\s*/,''))}</div>${pr[i]?`<div class="pr"><b>${won(pr[i].v)}</b><small>원</small></div>`:''}</div>`; }
  list.innerHTML = html || '<div class="count" style="padding:16px">조건에 맞는 곳이 없어요.</div>';
  document.getElementById('count').innerHTML = `${n}곳${PU?` · 가격 ${esc(when(PU))}`:''}` + (FORM?` · <a href="${reportUrl()}" target="_blank" rel="noopener" style="color:var(--ok);font-weight:600;text-decoration:none">제보하기</a>`:'');
  markers.forEach((m,i)=>m.setMap(visible(DATA[i])?map:null));
  const inf=document.getElementById('info'); if(!inf.hidden) inf.innerHTML=infoHtml();
  layoutLabels();
}
document.getElementById('list').addEventListener('click',e=>{const it=e.target.closest('.item'); if(it){ openCard(+it.dataset.i,true); }});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{const f=c.dataset.f; state[f]=!state[f]; c.classList.toggle('on',state[f]); closeCard(); render();}));
document.querySelectorAll('#fuel button').forEach(b=>b.addEventListener('click',()=>{ state.fuel=b.dataset.p; document.querySelectorAll('#fuel button').forEach(x=>x.classList.toggle('on',x===b)); closeCard(); render(); }));
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase(); render();});
// 손잡이: 탭하면 접기·펴기, 위로 쓸면 펴기, 아래로 쓸면 접기
{ const g=document.getElementById('grip'); let y0=null, swiped=false;
  g.addEventListener('click',()=>{ if(swiped){swiped=false;return;} preCardMin=null; setPanel(!panelEl().classList.contains('min')); });
  g.addEventListener('touchstart',e=>{ y0=e.touches[0].clientY; swiped=false; },{passive:true});
  g.addEventListener('touchend',e=>{ if(y0===null) return; const dy=e.changedTouches[0].clientY-y0; y0=null; if(Math.abs(dy)>25){ swiped=true; preCardMin=null; setPanel(dy>0); } },{passive:true}); }
document.getElementById('infoBtn').addEventListener('click',e=>{ e.stopPropagation(); const inf=document.getElementById('info'); inf.hidden=!inf.hidden; if(!inf.hidden) inf.innerHTML=infoHtml(); setTimeout(layoutLabels,0); });
document.addEventListener('click',e=>{ if(!e.target.closest('#info,#infoBtn')) closeInfo(); });
addEventListener('resize',()=>setTimeout(layoutLabels,100));
document.getElementById('zin').addEventListener('click',()=>{ if(map) map.setLevel(Math.max(1,map.getLevel()-1),{animate:true}); });
document.getElementById('zout').addEventListener('click',()=>{ if(map) map.setLevel(Math.min(14,map.getLevel()+1),{animate:true}); });
let myCircle=null;
document.getElementById('loc').addEventListener('click',()=>{
  if(!navigator.geolocation){return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll=new kakao.maps.LatLng(pos.coords.latitude,pos.coords.longitude);
    if(myCircle) myCircle.setMap(null);
    myCircle=new kakao.maps.Circle({center:ll,radius:30,strokeWeight:2,strokeColor:'#2f6fed',strokeOpacity:.9,fillColor:'#2f6fed',fillOpacity:.35}); myCircle.setMap(map);
    document.getElementById('loc').classList.add('on');
    map.setLevel(5); map.panTo(ll);
  },()=>{},{enableHighAccuracy:true,timeout:8000});
});
kakao.maps.load(()=>{
  map = new kakao.maps.Map(document.getElementById('map'), {center:new kakao.maps.LatLng(36.3504,127.3845), level:8});
  const size=new kakao.maps.Size(28,28), opt={offset:new kakao.maps.Point(14,14)}, COL={ok:'#0f9d8a',check:'#d98a00',no:'#8a939e'};
  for(const c in COL){ imgs[c]=new kakao.maps.MarkerImage(dotSvg(COL[c]),size,opt); imgsBig[c]=new kakao.maps.MarkerImage(dotSvg(COL[c],true),size,opt); }
  markers = DATA.map((p,i)=>{ const m=new kakao.maps.Marker({position:new kakao.maps.LatLng(p.y,p.x), image:imgs[p.c], title:p.n, zIndex:p.c==='no'?1:3}); kakao.maps.event.addListener(m,'click',()=>openCard(i,false)); return m; });
  kakao.maps.event.addListener(map,'click',()=>{ closeCard(); closeInfo(); });
  kakao.maps.event.addListener(map,'dragstart',()=>{ closeCard(); closeInfo(); });
  kakao.maps.event.addListener(map,'idle',layoutLabels);
  render();
  loadReports(); loadPrices();
});
</script>
</body>
