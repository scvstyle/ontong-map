<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>온통대전 캐시백 지도</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --sub:#5b6470; --line:#e4e7eb;
    --ok:#0f9d8a; --ok-soft:#e3f5f2; --chk:#d98a00; --chk-soft:#fdf2dc; --no:#8a939e; --no-soft:#eef0f2; --accent:#0f9d8a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:grid;grid-template-rows:auto 1fr;height:100%}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;z-index:5}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
  header .meta{font-size:12.5px;color:var(--sub)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--sub);display:inline-flex;align-items:center;gap:6px;user-select:none}
  .chip.on{border-color:var(--ink);color:var(--ink);font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .main{display:grid;grid-template-columns:360px 1fr;min-height:0}
  aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .search{padding:10px 12px;border-bottom:1px solid var(--line)}
  .search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
  .search input:focus{border-color:var(--accent)}
  .count{font-size:12.5px;color:var(--sub);padding:8px 14px 4px}
  .list{overflow:auto;flex:1}
  .item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
  .item:hover,.item.sel{background:#f2f6f5}
  .item .badge{grid-row:span 2;align-self:start;margin-top:2px;font-size:11px;font-weight:700;border-radius:6px;padding:3px 6px;white-space:nowrap}
  .b-ok{background:var(--ok-soft);color:var(--ok)} .b-chk{background:var(--chk-soft);color:var(--chk)} .b-no{background:var(--no-soft);color:#5b6470}
  .item .nm{font-size:14.5px;font-weight:600}
  .item .ad{font-size:12.5px;color:var(--sub)}
  #map{width:100%;height:100%;min-height:0}
  .mapwrap{position:relative;min-height:0}
  .ctrls{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:8px}
  .ctrl{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow:hidden}
  .ctrl button{width:40px;height:40px;border:0;background:#fff;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;font-family:inherit}
  .ctrl button+button{border-top:1px solid var(--line)}
  .ctrl button:active{background:#f2f6f5}
  .ctrl button.on svg{color:#2f6fed}
  .notice{position:absolute;left:12px;bottom:24px;z-index:3;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--sub);max-width:min(420px,70%);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .card{position:relative;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:14px 16px 12px;width:300px;font-size:13px;line-height:1.45;transform:translateY(-6px)}
  .card:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
  .card h3{margin:2px 22px 4px 0;font-size:15.5px}
  .card .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:18px;color:#999;cursor:pointer}
  .card .row{color:var(--sub);margin:2px 0}
  .card .why{background:var(--chk-soft);color:#8a5a00;border-radius:8px;padding:6px 8px;margin:8px 0 4px;font-size:12.5px}
  .card details{margin-top:6px;color:var(--sub);font-size:12px}
  .card .links{display:flex;gap:8px;margin-top:10px}
  .card .links a{flex:1;text-align:center;text-decoration:none;font-weight:600;font-size:13px;border-radius:9px;padding:8px 0;border:1px solid var(--line);color:var(--ink)}
  .card .links a.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .vote{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
  .vote .q{font-size:12px;color:var(--sub);margin-bottom:6px}
  .vote .vb{display:flex;gap:6px}
  .vote .vb button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .vote .vb button:hover{background:#f2f6f5}
  .vote button:disabled{opacity:.5;cursor:default}
  .vote .ops{display:block;width:100%;margin-top:6px;border:1px dashed var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:9px;padding:7px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .vote .msg{font-size:12px;color:var(--ok);font-weight:600;margin-top:4px;min-height:1em}
  .notice a{color:var(--ok);font-weight:600}
  .tabs{display:none}
  @media (max-width:820px){
    .main{grid-template-columns:1fr;grid-template-rows:1fr}
    aside{position:fixed;left:0;right:0;bottom:0;height:42%;z-index:6;border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.08);transition:height .2s}
    aside.min{height:96px}
    .grip{display:block;width:40px;height:5px;border-radius:3px;background:#cfd4da;margin:8px auto 2px;cursor:pointer}
    .notice{display:none}
    header{padding:10px 12px} header h1{font-size:16px} header>div:first-child{width:100%} .chips{margin:0 -12px;padding:0 12px;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:calc(100% + 24px)} .chips::-webkit-scrollbar{display:none} .chip{font-size:12px;padding:5px 9px;white-space:nowrap;flex:none}
    .card{width:270px}
  }
  .grip{display:none}
</style>
</head>

function card(p,i){
  const kakaoLink = p.u || `https://map.kakao.com/link/map/${encodeURIComponent(p.n)},${p.y},${p.x}`;
  const navLink = `https://map.kakao.com/link/to/${encodeURIComponent(p.kn||p.n)},${p.y},${p.x}`;
  const recs = p.rec.map(r=>`${esc(r.name)} — ${r.cashback==='제공'?'캐시백 제공':'미제공'}`).join('<br>');
  return `<div class="card"><button class="x" onclick="closeCard()">×</button>
    <span class="badge ${BADGE[p.c]}" style="font-size:11px;font-weight:700;border-radius:6px;padding:3px 6px">${LABEL[p.c]}</span>
    <h3>${esc(p.n)}</h3>
    <div class="row">${esc(p.a)}</div>
    ${p.b?`<div class="row">${esc(p.b)}${p.t==='충전소'?' · 충전소':''}</div>`:''}
    ${p.rep?`<div class="why">${esc(p.rep)}</div>`:''}
    ${p.r?`<div class="why">${esc(p.r)}</div>`:''}
    <details><summary>앱에 등록된 이름 (${p.rec.length})</summary>${recs}</details>
    <div class="links"><a href="${kakaoLink}" target="_blank" rel="noopener">카카오맵</a><a class="primary" href="${navLink}" target="_blank" rel="noopener">길찾기</a></div>
    ${FORM?`<div class="vote"><div class="q">${base(p)==='no'?'캐시백이 됐나요?':'정보가 틀렸나요?'}</div><div class="vb">${base(p)==='no'?`<button onclick="vote(${i},POS)">캐시백 됐어요</button>`:`<button onclick="vote(${i},'캐시백 안 됐어요')">캐시백 안 됐어요</button>`}<button onclick="vote(${i},'문을 닫았어요')">문을 닫았어요</button></div>${OPS?`<button class="ops" onclick="vote(${i},OPS_VAL,true)">운영자: 앱 표시대로</button>`:''}<div class="msg" id="votemsg"></div></div>`:''}
  </div>`;
}
function closeCard(){ if(overlay){overlay.setMap(null);} document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel')); }
function openCard(i, pan){
  const p=DATA[i];
  closeCard();
  overlay = new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(p.y,p.x), content:card(p,i), yAnchor:1.18, zIndex:10, clickable:true});
  overlay.setMap(map);
  if(pan) map.panTo(new kakao.maps.LatLng(p.y,p.x));
  const el=document.querySelector(`.item[data-i="${i}"]`); if(el){el.classList.add('sel'); el.scrollIntoView({block:'nearest'});}
}
function render(){
  const list=document.getElementById('list'); let n=0, html='';
  const order=DATA.map((p,i)=>i).filter(i=>visible(DATA[i])).sort((a,b)=>(RANK[DATA[a].c]-RANK[DATA[b].c]) || DATA[a].g.localeCompare(DATA[b].g) || DATA[a].n.localeCompare(DATA[b].n));
  for(const i of order){ const p=DATA[i]; n++;
    html+=`<div class="item" data-i="${i}"><span class="badge ${BADGE[p.c]}">${SHORT[p.c]}</span><div class="nm">${esc(p.n)}</div><div class="ad">${esc(p.g)} · ${esc(p.a.replace(/^대전(광역시)?\s*\S+구\s*/,''))}</div></div>`; }
  list.innerHTML = html || '<div class="count" style="padding:16px">조건에 맞는 곳이 없어요.</div>';
  document.getElementById('count').innerHTML = `${n}곳 표시 중` + (FORM?` · <a href="${reportUrl()}" target="_blank" rel="noopener" style="color:var(--ok);font-weight:600;text-decoration:none">정보 제보하기</a>`:'');
  markers.forEach((m,i)=>m.setMap(visible(DATA[i])?map:null));
}
document.getElementById('list').addEventListener('click',e=>{const it=e.target.closest('.item'); if(it){ openCard(+it.dataset.i,true); if(innerWidth<=820){document.getElementById('panel').classList.add('min');document.body.classList.add('min');} }});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{const f=c.dataset.f; state[f]=!state[f]; c.classList.toggle('on',state[f]); closeCard(); render();}));
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase(); render();});
document.getElementById('grip').addEventListener('click',()=>{const a=document.getElementById('panel'); a.classList.toggle('min'); document.body.classList.toggle('min');});
document.getElementById('zin').addEventListener('click',()=>{ if(map) map.setLevel(Math.max(1,map.getLevel()-1),{animate:true}); });
document.getElementById('zout').addEventListener('click',()=>{ if(map) map.setLevel(Math.min(14,map.getLevel()+1),{animate:true}); });
let myCircle=null;
document.getElementById('loc').addEventListener('click',()=>{
  if(!navigator.geolocation){return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll=new kakao.maps.LatLng(pos.coords.latitude,pos.coords.longitude);
    if(myCircle) myCircle.setMap(null);
    myCircle=new kakao.maps.Circle({center:ll,radius:30,strokeWeight:2,strokeColor:'#2f6fed',strokeOpacity:.9,fillColor:'#2f6fed',fillOpacity:.35}); myCircle.setMap(map);
    document.getElementById('loc').classList.add('on');
    map.setLevel(5); map.panTo(ll);
  },()=>{},{enableHighAccuracy:true,timeout:8000});
});
kakao.maps.load(()=>{
  map = new kakao.maps.Map(document.getElementById('map'), {center:new kakao.maps.LatLng(36.3504,127.3845), level:8});
  const size=new kakao.maps.Size(30,40), opt={offset:new kakao.maps.Point(15,40)};
  imgs.ok=new kakao.maps.MarkerImage(pinSvg('#0f9d8a'),size,opt); imgs.check=new kakao.maps.MarkerImage(pinSvg('#d98a00'),size,opt); imgs.no=new kakao.maps.MarkerImage(pinSvg('#8a939e'),size,opt);
  markers = DATA.map((p,i)=>{ const m=new kakao.maps.Marker({position:new kakao.maps.LatLng(p.y,p.x), image:imgs[p.c], title:p.n, zIndex:p.c==='no'?1:3}); kakao.maps.event.addListener(m,'click',()=>openCard(i,false)); return m; });
  kakao.maps.event.addListener(map,'click',closeCard);
  render();
  loadReports();
});
if(FORM){ document.getElementById('rep').innerHTML=` <a href="${reportUrl()}" target="_blank" rel="noopener">정보 제보하기</a>`; }
</script>
</body>
</html>
