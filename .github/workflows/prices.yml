# 오피넷 키는 저장소 Settings > Secrets > Actions 의 OPINET_KEY 에 있어요.
name: update-prices
on:
  schedule:
    - cron: '17 21,0,3,6,9,12 * * *'   # 한국시간 06:17부터 3시간마다 21:17까지 6번(하루 162건). GitHub 예약 실행은 늦거나 빠질 수 있어 여유 있게 잡았어요
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch_prices.py', '.github/workflows/prices.yml']
permissions:
  contents: write
concurrency: prices
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 오피넷 가격 가져오기
        run: python3 scripts/fetch_prices.py
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
      - name: 바뀌었으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f prices.json ] || exit 0
          git add prices.json
          git diff --cached --quiet && exit 0
          git commit -m "가격 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          git pull --rebase -q && git push
